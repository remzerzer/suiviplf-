name: Collecte du dossier

on:
  workflow_dispatch:
    inputs:
      dossier:
        description: "Reference du dossier legislatif"
        required: true
        default: "DLR5L17N52428"
      dates:
        description: "Dates a examiner, separees par des virgules"
        required: true
        default: "2025-10-14,2025-10-23,2025-11-21,2025-12-15,2026-02-02"

permissions:
  contents: write
  pull-requests: write

jobs:
  collecte:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le contenu du depot
        uses: actions/checkout@v4

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Lancer la collecte
        run: node outils/collecte.mjs "${{ inputs.dossier }}" "${{ inputs.dates }}"

      - name: Ouvrir une proposition avec le rapport
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "Robot de suivi PLF"
          git config user.email "actions@github.com"
          git add -A rapports
          if git diff --cached --quiet; then
            echo "Aucun rapport produit."
            exit 0
          fi
          BRANCHE="collecte-$(date -u +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCHE"
          git commit -m "Collecte du dossier ${{ inputs.dossier }}"
          git push origin "$BRANCHE"
          gh pr create \
            --base main \
            --head "$BRANCHE" \
            --title "Collecte du dossier ${{ inputs.dossier }}" \
            --body "Rapport de collecte sur le flux de l Assemblee nationale.

          Le programme a releve les documents publies aux dates demandees, ouvert leur notice, et retenu ceux qui se rattachent au dossier indique. Pour chacun, il propose l etape du catalogue qui parait convenir.

          Ce rapport ne modifie ni la frise ni la sequence. Ouvrez le fichier depose dans le dossier rapports pour le lire."
