name: Sonde du dossier

on:
  workflow_dispatch:
    inputs:
      dossier:
        description: "Reference du dossier legislatif"
        required: true
        default: "DLR5L17N52428"

permissions:
  contents: write
  pull-requests: write

jobs:
  sonde:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le contenu du depot
        uses: actions/checkout@v4

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Lancer la sonde
        run: node outils/sonde-dossier.mjs "${{ inputs.dossier }}"

      - name: Ouvrir une proposition avec le rapport
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "Robot de suivi PLF"
          git config user.email "actions@github.com"
          git add -A rapports
          if git diff --cached --quiet; then
            echo "Aucun rapport produit."
            exit 0
          fi
          BRANCHE="sonde-$(date -u +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCHE"
          git commit -m "Sonde du dossier ${{ inputs.dossier }}"
          git push origin "$BRANCHE"
          gh pr create \
            --base main \
            --head "$BRANCHE" \
            --title "Sonde du dossier ${{ inputs.dossier }}" \
            --body "Rapport de diagnostic sur la source qui contient les actes dates du dossier legislatif.

          Ce rapport ne modifie ni la frise ni la sequence. Ouvrez le fichier depose dans le dossier rapports pour le lire."
