name: Sonde des actes

on:
  workflow_dispatch:
    inputs:
      dossier:
        description: "Reference du dossier legislatif"
        required: true
        default: "DLR5L17N52428"

permissions:
  contents: write
  pull-requests: write

jobs:
  actes:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le contenu du depot
        uses: actions/checkout@v4

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Lancer la sonde des actes
        run: node outils/sonde-actes.mjs "${{ inputs.dossier }}"

      - name: Ouvrir une proposition avec le rapport
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "Robot de suivi PLF"
          git config user.email "actions@github.com"
          git add -A rapports
          if git diff --cached --quiet; then
            echo "Aucun rapport produit."
            exit 0
          fi
          BRANCHE="actes-$(date -u +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCHE"
          git commit -m "Sonde des actes du dossier ${{ inputs.dossier }}"
          git push origin "$BRANCHE"
          gh pr create \
            --base main \
            --head "$BRANCHE" \
            --title "Sonde des actes du dossier ${{ inputs.dossier }}" \
            --body "Contenu complet des actes decisifs du dossier legislatif.

          Ce rapport doit permettre de savoir comment une decision de seance distingue une adoption d un rejet, et comment une commission mixte enregistre son issue.

          Il ne modifie ni la frise ni la sequence. Ouvrez le fichier depose dans le dossier rapports pour le lire."
