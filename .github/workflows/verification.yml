name: Verification des donnees

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le contenu du depot
        uses: actions/checkout@v4

      - name: Enregistrer l horodatage de la verification
        run: |
          mkdir -p donnees
          date -u "+%d/%m/%Y a %H:%M UTC" > donnees/derniere-verification.txt

      - name: Ouvrir une proposition si quelque chose a change
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "Robot de suivi PLF"
          git config user.email "actions@github.com"
          git add -A donnees
          if git diff --cached --quiet; then
            echo "Aucun changement, aucune proposition ouverte."
            exit 0
          fi
          HORODATAGE=$(date -u "+%d/%m/%Y a %H:%M UTC")
          BRANCHE="maj-$(date -u +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCHE"
          git commit -m "Verification du $HORODATAGE"
          git push origin "$BRANCHE"
          gh pr create \
            --base main \
            --head "$BRANCHE" \
            --title "Verification du $HORODATAGE" \
            --body "Passage automatique du robot de suivi.

          Aucune donnee parlementaire n est encore collectee a ce stade. Ce passage se contente d enregistrer l heure de verification, afin de controler que la tache se declenche seule et vous soumet bien une proposition.

          Vous pouvez publier ou fermer cette proposition sans consequence."
