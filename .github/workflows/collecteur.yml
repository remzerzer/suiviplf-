name: Collecteur du dossier

on:
  workflow_dispatch:
    inputs:
      dossier:
        description: "Reference du dossier legislatif"
        required: true
        default: "DLR5L17N52428"
      sortie:
        description: "Fichier de sequence a produire"
        required: true
        default: "donnees/plf-2026-auto.json"
      reference:
        description: "Sequence saisie a la main, pour comparaison"
        required: false
        default: "donnees/plf-2026.json"

permissions:
  contents: write
  pull-requests: write

jobs:
  collecteur:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le contenu du depot
        uses: actions/checkout@v4

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Lancer le collecteur
        run: node outils/collecteur.mjs "${{ inputs.dossier }}" "${{ inputs.sortie }}" "${{ inputs.reference }}"

      - name: Ouvrir une proposition
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "Robot de suivi PLF"
          git config user.email "actions@github.com"
          git add -A donnees rapports
          if git diff --cached --quiet; then
            echo "Aucun changement."
            exit 0
          fi
          BRANCHE="collecteur-$(date -u +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCHE"
          git commit -m "Collecte automatique du dossier ${{ inputs.dossier }}"
          git push origin "$BRANCHE"
          gh pr create \
            --base main \
            --head "$BRANCHE" \
            --title "Collecte automatique du dossier ${{ inputs.dossier }}" \
            --body "Le programme a lu le dossier legislatif et traduit ses actes en jalons.

          Deux fichiers sont proposes. La sequence automatique, qui ne remplace pas la sequence validee. Et un rapport de comparaison, qui indique ce que le programme a trouve en plus ou en moins par rapport a la saisie manuelle.

          Ouvrez le rapport dans le dossier rapports avant de decider."
