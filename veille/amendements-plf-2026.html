<script id='donnees' type='application/json'>[{"numero":"I-1","texte_plf":"APRÈS ART. 3","article":"CGI art. 885 A ; CGI/LPF art. 885 B, 6, 885 N, 669, 767, 1094‑1, 751, 792‑0 bis, 795, 795‑0 A, 754 B, 761, 726, 1380, 1407, L. 136‑1, 235 ter, 224, 223 sexies, 204, 4 B, 164 D, 885 O, 1716 bis, 1723 ter, 1715, 1717, L. 269","resume":"Crée un chapitre Ier bis et les articles 885 A à 885 J du CGI instituant un impôt plancher sur la fortune. La mesure assujettit les personnes dont la valeur des actifs visés excède 100 millions d’euros, prévoit une imposition commune des couples mariés et des partenaires de PACS, et organise notamment une imposition lors du transfert de domicile fiscal avec possibilité d’étalement du paiement sur dix ans. L’exposé des motifs indique que l’objectif est de garantir que les très hauts patrimoines paient au moins 2 % de leur fortune en impôts chaque année.","auteur":"Mme Sas (Écologiste et Social)","sort":"Rejeté","lien":"https://www.assemblee-nationale.fr/dyn/17/amendements/AMANR5L17PO838901B1906P1D1N000001"},{"numero":"I-48","texte_plf":"APRÈS ART. 27","article":"CGI art. 1407 ter","resume":"Modifie l’article 1407 ter en y insérant un 4°. Le 4° vise les logements situés à proximité du lieu d’exercice professionnel et concernés lorsqu’ils sont destinés à l’hébergement par les entreprises de leurs travailleurs saisonniers au sens du 3° de l’article L.1242‑2 du code du travail. L’exposé des motifs indique que la mesure vise à exonérer ces logements de la taxe d’habitation sur les résidences secondaires pour répondre à une injustice fiscale dans les territoires touristiques.","auteur":"Mme Bonnivard (Droite Républicaine)","sort":"Retiré","lien":"https://www.assemblee-nationale.fr/dyn/17/amendements/AMANR5L17PO838901B1906P1D1N000048"},{"numero":"I-127","texte_plf":"APRÈS ART. 3","article":"CGI art. 885 A ; CGI/LPF/CIBS art. 885 C, 6, 885 V, 754 B, 669, 767, 1094‑1, 751, 792‑0 bis, 795, 795‑0 A, 787 B, 793, 795 A, L. 416‑1, L. 418‑1, 885 P, 885 Q, 885 O, 62, 220 quater, 885 G, L. 411‑37, 761, 726, L. 173‑1, L. 423‑25, L. 424‑1, L. 421‑1, 885 W, 885 N, 1380, 1407, L. 136‑1, 235 ter, 224, 223 sexies, 170, 204, 4 B, 164 D, 1716 bis, 1723 ter, 1658, 1715, 1717, L. 269","resume":"Rétablit le chapitre Ier bis du titre IV du livre Ier du CGI et institue un impôt de solidarité sur la fortune. Le texte pose que sont soumises à cet impôt les personnes physiques dont la valeur des actifs visés est supérieure à 1 million d’euros, précise les règles d’assiette et d’imposition commune des couples mariés et pacsés, et crée un article 885 A bis soumettant, lors du transfert du domicile fiscal hors de France, les personnes domiciliées fiscalement en France au moins six des dix années précédant le transfert et dont la valeur nette taxable dépasse 100 millions d’euros à une imposition au tarif égal à dix fois celui prévu à l’article 885 V ter, avec possibilité d’étalement du paiement jusqu’à dix ans. L’exposé des motifs indique que cette refondation de l’ISF vise à en faire un outil prenant en compte à la fois les enjeux sociaux, budgétaires et climatiques.","auteur":"Mme Sas (Écologiste et Social)","sort":"Rejeté","lien":"https://www.assemblee-nationale.fr/dyn/17/amendements/AMANR5L17PO838901B1906P1D1N000127"},{"numero":"I-155","texte_plf":"APRÈS ART. 27","article":"CGI art. 1001","resume":"Modifie l’article 1001 du CGI relatif aux taux de la taxe sur les conventions d’assurance. Remplace le taux « 18 % » par « 19,5 % » au 5° bis de l’article 1001 et fixe la fraction de taux visée par l’article 53 de la loi de finances pour 2005 à « 7,95 % ». L’exposé des motifs indique que l’augmentation vise à accroître les ressources affectées au financement des services départementaux d’incendie et de secours.","auteur":"M. Pauget (Droite Républicaine)","sort":"Retiré","lien":"https://www.assemblee-nationale.fr/dyn/17/amendements/AMANR5L17PO838901B1906P1D1N000155"},{"numero":"I-278 (Rect)","texte_plf":"ART. 10","article":"CGI art. 73","resume":"Modifie l’article 73 du CGI. Au deuxième alinéa, il remplace le taux « 70 % » par le taux « 50 % ». L’exposé des motifs indique que cette baisse vise à rendre la déduction pour épargne de précaution (DEP) plus attractive et efficace pour les exploitants agricoles.","auteur":"M. Nury (Droite Républicaine)","sort":"Adopté","lien":"https://www.assemblee-nationale.fr/dyn/17/amendements/AMANR5L17PO838901B1906P1D1N000278"},{"numero":"I-336","texte_plf":"APRÈS ART. 36","article":"CIBS art. 36","resume":"Modifie, par l’article 36, les montants et le plafond afférents à l’article L.642‑13 du code rural et de la pêche maritime relatifs aux droits perçus pour l’INAO. Remplace successivement les montants suivants : 0,15 € par 0,19 €, 0,12 € par 0,15 €, 1,2 € par 1,5 €, 0,03 € par 0,04 €, 0,075 € par 0,093 €, 0,75 € par 0,93 €, 10 € par 12,4 €, 7,5 € par 9,3 €, et fixe le plafond du produit des ressources à 7 330 000 € ; il prévoit en outre, à compter de 2028, une indexation annuelle sur l’inflation limitée entre 0 % et 1,75 % et un arrondi au centime supérieur. L’exposé des motifs indique que la mesure vise à actualiser et consolider le financement de l’INAO en entérinant une augmentation des droits demandée par les filières sous signes de qualité.","auteur":"Mme Bazin-Malgras (Droite Républicaine)","sort":"Retiré","lien":"https://www.assemblee-nationale.fr/dyn/17/amendements/AMANR5L17PO838901B1906P1D1N000336"},{"numero":"I-348","texte_plf":"APRÈS ART. 27","article":"CGI art. 1382 J, 1639 A, L. 732, L. 123","resume":"Crée l’article 1382 J au CGI. Autorise les collectivités territoriales et les établissements publics de coopération intercommunale à fiscalité propre, par délibération prise selon l’article 1639 A bis, à exonérer totalement pour leur part de taxe foncière sur les propriétés bâties les immeubles appartenant à des établissements privés à but non lucratif en contrat avec l’État (EESPIG) affectés au service public de l’enseignement supérieur et de la recherche, sous réserve d’une déclaration au service des impôts avant le 1er janvier de l’année d’application. L’exposé des motifs indique que la mesure vise à établir une équité de traitement avec les établissements publics et à soutenir l’enseignement supérieur privé non lucratif.","auteur":"M. Castellani (LIOT)","sort":"Retiré","lien":"https://www.assemblee-nationale.fr/dyn/17/amendements/AMANR5L17PO838901B1906P1D1N000348"},{"numero":"I-425","texte_plf":"APRÈS ART. 27","article":"CGI art. 1383","resume":"Complète l’article 1383 du CGI en y insérant un IV. Exonère à hauteur de 100 % de la base imposable, pendant les cinq années suivant leur achèvement, les constructions nouvelles, reconstructions et additions de construction autres que d’usage d’habitation situées sur des friches au sens de l’article L.111‑26 du code de l’urbanisme. L’exposé des motifs indique que la mesure vise à compenser les surcoûts de réhabilitation et à favoriser la reconversion des friches.","auteur":"M. Le Fur (Droite Républicaine)","sort":"Retiré","lien":"https://www.assemblee-nationale.fr/dyn/17/amendements/AMANR5L17PO838901B1906P1D1N000425"},{"numero":"I-488","texte_plf":"APRÈS ART. 3","article":"CGI art. 91, 154 bis","resume":"Il rétablit l'article 91 du CGI. L'article prévoit que, lorsque le titulaire d'un plan d'épargne retraite (PER) décède après l'échéance prévue, les sommes perçues par ses ayants droit correspondant à des versements déduits au titre des articles 154 bis, 154 bis-0 A et 163 quatervicies sont soumises à l'impôt sur le revenu, et qu'un abattement égal au montant de ces sommes est opéré pour la perception des droits de mutation à titre gratuit sur la part de chaque ayant droit. L'exposé des motifs indique que la mesure vise à neutraliser le risque d'optimisation fiscale résultant de la déduction à l'entrée des versements sur le PER en assurant le rattrapage fiscal en cas de décès.","auteur":"Mme Gérard (Horizons & Indépendants)","sort":"Retiré","lien":"https://www.assemblee-nationale.fr/dyn/17/amendements/AMANR5L17PO838901B1906P1D1N000488"},{"numero":"I-518","texte_plf":"APRÈS ART. 29","article":"CGI art. 240, 1736","resume":"Modifie les articles 240 et 1736 du CGI. Impute la communication prévue à l’article 240 à « dans un délai de trente jours à la suite d’une demande de l’administration fiscale », supprime plusieurs alinéas de l’article 240 et adapte l’article 1736 en retirant la mention de l’article 240 dans la première phrase et en précisant que l’amende s’applique également à ceux ne respectant pas l’obligation prévue à l’article 240. L’exposé des motifs indique que la mesure vise à remplacer la DAS2 annuelle par une déclaration fournie « à la demande » dans un délai de 30 jours.","auteur":"Mme Duby-Muller (Droite Républicaine)","sort":"Retiré","lien":"https://www.assemblee-nationale.fr/dyn/17/amendements/AMANR5L17PO838901B1906P1D1N000518"},{"numero":"I-519","texte_plf":"APRÈS ART. 29","article":"CGI art. 54 quater","resume":"Modifie l’article 54 quater du CGI. Remplace l’obligation de produire le relevé des frais généraux « à l’appui de la déclaration de leurs résultats de chaque exercice » par une obligation de le produire « dans un délai de trente jours à la suite d’une demande de l’administration fiscale ». L’exposé des motifs indique que la mesure vise à simplifier les obligations déclaratives en supprimant la déclaration systématique tout en laissant la possibilité de communication sur demande.","auteur":"Mme Duby-Muller (Droite Républicaine)","sort":"Retiré","lien":"https://www.assemblee-nationale.fr/dyn/17/amendements/AMANR5L17PO838901B1906P1D1N000519"},{"numero":"I-520","texte_plf":"APRÈS ART. 29","article":"CGI art. 175, 223, 1679 septies","resume":"Modifie les articles 175, 223 et 1679 septies du CGI en matière d’échéances déclaratives. Remplace les mentions « deuxième jour ouvré suivant le 1er avril » et « deuxième jour ouvré suivant le 1er mai » par la date fixe « 15 mai » pour les échéances visées dans ces dispositions. L’exposé des motifs indique que la mesure vise à aligner l’ensemble des déclarations professionnelles sur une date unique.","auteur":"Mme Duby-Muller (Droite Républicaine)","sort":"Retiré","lien":"https://www.assemblee-nationale.fr/dyn/17/amendements/AMANR5L17PO838901B1906P1D1N000520"},{"numero":"I-566","texte_plf":"ART. 5","article":"CGI art. 199, 73 B","resume":"Modifie l’article 199 vicies A du CGI en transformant la réduction d’impôt applicable au dispositif en un crédit d’impôt et en adaptant ses conditions d’application. Le crédit s’applique aux ventes sans différé (contrat authentique, évaluation par un organisme comptable, paiement en numéraire, société gérée majoritairement par des associés exploitants), la cession devant intervenir entre le 1er janvier 2026 et le 31 décembre 2035, et il est fixé à 50 % avec des formules et plafonds annuels prévus : 50 % des intérêts perçus dans la limite de 15 000 € pour les célibataires et 20 000 € pour les mariés, et 50 % du prix de vente dans la limite de 20 000 € pour les célibataires et 25 000 € pour les mariés. L’exposé des motifs indique que l’objectif est de favoriser la transmission d’exploitations agricoles à des jeunes et de moderniser un dispositif peu utilisé. (identique à l’amendement I-3709)","auteur":"M. Rolland (Droite Républicaine)","sort":"Retiré","lien":"https://www.assemblee-nationale.fr/dyn/17/amendements/AMANR5L17PO838901B1906P1D1N000566"},{"numero":"I-583 (Rect)","texte_plf":"ART. 5","article":"CGI art. 244 quater M","resume":"Modifie l’article 244 quater M en prorogeant le dispositif existant. Remplace la mention « jusqu’au 31 décembre 2024 » par « jusqu’au 31 décembre 2027 » et précise que le I n’est applicable qu’aux sommes venant en déduction de l’impôt dû. L’exposé des motifs indique que la prorogation vise à maintenir le soutien à la conversion et au maintien des exploitations en agriculture biologique et HVE pendant deux années supplémentaires.","auteur":"M. Daubié (Les Démocrates)","sort":"Retiré","lien":"https://www.assemblee-nationale.fr/dyn/17/amendements/AMANR5L17PO838901B1906P1D1N000583"},{"numero":"I-627","texte_plf":"APRÈS ART. 27","article":"CGI art. 995, 1001","resume":"Modifie les articles 995 et 1001 du CGI relatifs aux exonérations et aux taux de la TSCA. Supprime les références aux navires de commerce et plusieurs alinéas (notamment le 4°, 11°, 11° bis et 11° ter) de l’article 995, remplace des mentions liées au transport terrestre par des mentions liées au transport ferroviaire et insère, après le 5° quater de l’article 1001, deux nouveaux items taxés à 18 % pour les contrats d’assurance sur corps, marchandises transportées et responsabilité civile du transporteur des aéronefs et des navires de commerce. L’exposé des motifs indique que la mesure vise à supprimer des exonérations et à augmenter les recettes de la TSCA afin de renforcer le financement des SDIS.","auteur":"M. Pauget (Droite Républicaine)","sort":"Retiré","lien":"https://www.assemblee-nationale.fr/dyn/17/amendements/AMANR5L17PO838901B1906P1D1N000627"},{"numero":"I-639","texte_plf":"APRÈS ART. 3","article":"CGI art. 885 A ; CGI/CIBS art. 6, 754 B, 669, 767, 751, 792‑0 bis, 795, 795‑0 A, 787 B, 793, 795 A, L. 416‑1, L. 418‑1, 885 P, 885 Q, 750 ter, 885 O, 62, 220 quater, 885 G, L. 411‑37, 761, 726, 885 V, L. 173‑1, L. 423‑25, L. 424‑1, 885 W, 885 N, 223 sexies, 170, 204, 4 B, 164 D, 1723 ter, 1658, 1681 A, 1715, 1717, 1929","resume":"Il rétablit le chapitre I bis du titre IV du livre Ier du CGI et crée les articles 885 A à 885 G quater relatifs à un impôt de solidarité sur la fortune. L'assujettissement s'applique lorsque la valeur nette taxable excède 1 000 000 €, les personnes domiciliées fiscalement en France étant imposées sur leurs biens situés en France et hors de France (avec exonération des biens hors de France pour les nouveaux domiciliés pendant cinq années civiles suivant l'établissement du domicile) et les non‑résidents à raison de leurs biens situés en France ; le chapitre précise les règles d'assiette, d'ajout pour certains contrats d'assurance, et l'intégration de biens placés en fiducie ou en trust. L'exposé des motifs indique que la mesure institue, à compter du 1er janvier 2026, un « ISF climatique » composé de trois volets (socle, chapeau et plancher) et d'un mécanisme bonus‑malus fondé sur l'empreinte carbone des actifs.","auteur":"M. Philippe Brun (Socialistes et apparentés)","sort":"Rejeté","lien":"https://www.assemblee-nationale.fr/dyn/17/amendements/AMANR5L17PO838901B1906P1D1N000639"},{"numero":"I-685","texte_plf":"APRÈS ART. 3","article":"CGI art. 777, 779, 784, 790 F, 790 G","resume":"Modifie les articles 777, 779, 784, 790 F et 790 G du CGI. Le dispositif revoit les tableaux du barème en introduisant une ligne « Au‑delà de 3 611 354 €47 », remplace les montants « 15 932 € » par « 31 865 € » et « 7 967 € » par « 15 932 € », réduit le délai de rappel de « quinze ans » à « dix ans », crée des abattements de 31 865 € pour les enfants de conjoint et pour les petits‑enfants de conjoint et étend la mention des bénéficiaires au I de l’article 790 G afin d’y inclure « d’un enfant de conjoint ou d’un petit‑enfant de conjoint ». L’exposé des motifs indique que ces ajustements visent à prendre en compte les réalités familiales contemporaines et à rééquilibrer la fiscalité des transmissions en maintenant l’équilibre budgétaire.","auteur":"M. Jean-René Cazeneuve (Ensemble pour la République)","sort":"Retiré","lien":"https://www.assemblee-nationale.fr/dyn/17/amendements/AMANR5L17PO838901B1906P1D1N000685"},{"numero":"I-695","texte_plf":"APRÈS ART. 25","article":"CGI art. 286, 1770 duodecies","resume":"Modifie le 3° bis du I de l’article 286 et le premier alinéa de l’article 1770 duodecies du CGI pour réintroduire l’auto‑attestation des éditeurs de logiciels de caisse. Ajoute la possibilité d’une « attestation individuelle de l’éditeur, conforme à un modèle fixé par l’administration » au 3° bis du I de l’article 286 et insère les mots « de l’attestation ou » après « production » au premier alinéa de l’article 1770 duodecies. L’exposé des motifs indique que la mesure vise à préserver la possibilité d’auto‑certification pour éviter des coûts excessifs pour les PME et les TPE.","auteur":"M. Le Fur (Droite Républicaine)","sort":"Retiré","lien":"https://www.assemblee-nationale.fr/dyn/17/amendements/AMANR5L17PO838901B1906P1D1N000695"},{"numero":"I-772","texte_plf":"ART. 3","article":"CGI art. 223 VJ bis","resume":"Crée l’article 223 VJ bis du CGI instituant une surtaxe sur les profits non distribués pour certaines entreprises. Les entreprises dont plus de 60 % des produits sont des revenus passifs s’acquittent d’une surtaxe de 20 % sur leurs profits non distribués, ces derniers étant déterminés comme la somme des bénéfices affectés en report à nouveau, en rachat d’actions et en mise en réserve, à l’exclusion de la constitution de la réserve légale prévue à l’article L. 232‑10 du code de commerce. L’exposé indique que la mesure vise à taxer les profits échappant à l’impôt sur le revenu via l’utilisation de holdings et la thésaurisation.","auteur":"Mme Pirès Beaune (Socialistes et apparentés)","sort":"Rejeté","lien":"https://www.assemblee-nationale.fr/dyn/17/amendements/AMANR5L17PO838901B1906P1D1N000772"},{"numero":"I-781","texte_plf":"APRÈS ART. 3","article":"CGI art. 964, 965, 966, 967, 973, 974, 975, 975 bis","resume":"Modifie et complète les dispositions du CGI relatives à l’impôt sur la fortune en transformant l’impôt sur la fortune immobilière (IFI) en un impôt sur la fortune financière via des modifications des articles 964 à 975 et l’insertion d’un article 975 bis. L’assiette devient le patrimoine net au 1er janvier de l’ensemble du patrimoine et l’amendement exclut de cette assiette la résidence principale, les actifs nécessaires à l’activité professionnelle, les parts ou actions de très petites, petites, moyennes entreprises et entreprises de taille intermédiaire à concurrence de trois quarts de leur valeur nette, ainsi que les œuvres d’art détenues depuis plus de dix ans. L’exposé des motifs présente cette transformation comme visant à taxer la fortune financière plutôt que la seule propriété immobilière et à préserver les biens professionnels.","auteur":"M. Jean-Philippe Tanguy et les membres du groupe Rassemblement National (Rassemblement National)","sort":"Tombé","lien":"https://www.assemblee-nationale.fr/dyn/17/amendements/AMANR5L17PO838901B1906P1D1N000781"},{"numero":"I-788","texte_plf":"APRÈS ART. 3","article":"CGI art. 117 quater, 4 B, 108, 150‑0 A, 1417, 242 quater, 200 A, 216","resume":"L'amendement modifie les articles 117 quater, 200 A et 216 du CGI. Il crée un 1 bis à l'article 117 quater soumettant les personnes physiques domiciliées fiscalement en France qui perçoivent des revenus distribués de sociétés redevables de l'impôt sur les sociétés réalisant un chiffre d'affaires de plus de 750 000 000 € à un prélèvement au taux de 17,8 % sur la part excédant 1,20 fois la moyenne (2016-2024) des revenus distribués et des rachats au titre des années 2025 et 2026, en excluant du calcul les années où cette somme est inférieure à trente points de pourcentage du résultat net et en prévoyant que les foyers dont le revenu fiscal de référence de l'avant-dernière année est inférieur à 50 000 € (célibataires) ou 75 000 € (imposition commune) peuvent demander à être dispensés selon l'article 242 quater. Il étend la même règle au gain net tiré des rachats (article 200 A) pour la part excédant 1,20 fois la moyenne et fixe, pour la part excédant 1,20 fois la moyenne, une quote‑part de frais et charges à 10 % pour les produits de participations visés à l'article 216.","auteur":"M. Jean-Philippe Tanguy et les membres du groupe Rassemblement National (Rassemblement National)","sort":"Retiré","lien":"https://www.assemblee-nationale.fr/dyn/17/amendements/AMANR5L17PO838901B1906P1D1N000788"},{"numero":"I-996","texte_plf":"APRÈS ART. 10","article":"CGI art. 244 quater L","resume":"Dispositif non exploitable","auteur":"Mme Trouvé (La France insoumise - NFP)","sort":"Irrecevable","lien":"https://www.assemblee-nationale.fr/dyn/17/amendements/AMANR5L17PO838901B1906P1D1N000996"},{"numero":"I-1280","texte_plf":"APRÈS ART. 27","article":"CGI art. 1407","resume":"Modifie l’article 1407 du CGI en y insérant un nouvel item. Ajoute, au II de l’article 1407, un 5° exonérant les locaux des établissements et services sociaux et médico‑sociaux énumérés à l’article L.312‑1 du code de l’action sociale et des familles. L’exposé des motifs indique que la mesure vise à étendre l’exonération de taxe d’habitation à l’ensemble des ESSMS privés à but non lucratif.","auteur":"M. Ceccoli (Droite Républicaine)","sort":"Retiré","lien":"https://www.assemblee-nationale.fr/dyn/17/amendements/AMANR5L17PO838901B1906P1D1N001280"},{"numero":"I-1328","texte_plf":"ART. 3","article":"CGI art. 235 ter, 39, 219, L. 233‑1","resume":"Insère un article 235 ter ZD bis A au CGI et crée une taxe annuelle applicable aux holdings familiales détenant des titres de placement. Définit les « titres de placement » et la « société holding familiale » et soumet ces holdings familiales à une taxe annuelle égale à 2 % de la valeur nette des titres de placement inscrits à l’actif à la clôture de l’exercice, recouvrée et contrôlée comme l’impôt sur les sociétés. L’exposé des motifs indique que la mesure vise à clarifier la qualification des titres de placement et à lutter contre l’optimisation via des holdings non opérationnelles.","auteur":"M. de Courson (LIOT)","sort":"Rejeté","lien":"https://www.assemblee-nationale.fr/dyn/17/amendements/AMANR5L17PO838901B1906P1D1N001328"},{"numero":"I-1502","texte_plf":"APRÈS ART. 10","article":"CGI art. 244 quater B, L. 244 quater L, 107","resume":"Crée l’article 244 quater AB du CGI. Il institue un crédit d’impôt de 4 500 euros pour les entreprises agricoles engagées contractuellement au 31 décembre 2026 ou au cours des années 2027 à 2030 dans un programme collectif de recherche appliquée sur la sortie des pesticides ; ce crédit est cumulable avec le crédit d’impôt visé à l’article L. 244 quater L, multiplié pour les groupements agricoles d’exploitation en commun par le nombre d’associés sans pouvoir excéder quatre fois le crédit, et son bénéfice est subordonné au respect des règlements européens d’aides de minimis. L’exposé des motifs indique que la mesure vise à soutenir la recherche d’alternatives aux pesticides et à accompagner la transition agricole.","auteur":"Mme Le Feur (Ensemble pour la République)","sort":"Rejeté","lien":"https://www.assemblee-nationale.fr/dyn/17/amendements/AMANR5L17PO838901B1906P1D1N001502"},{"numero":"I-1503","texte_plf":"APRÈS ART. 10","article":"CGI art. 15, L. 411‑1, 1394 B, 1394 D, 1395 B","resume":"Rétablit le I de l’article 15 et modifie les articles 1394 B bis, 1394 D et 1395 B bis du CGI. Exonère de l’impôt sur le revenu les revenus issus d’un bail rural, remplace le taux « 30 % » par « 50 % » à la fin du I de l’article 1394 B bis, prévoit que les propriétés non bâties ayant conclu certains contrats sont exonérées de taxe foncière sur les propriétés non bâties pendant toute la durée du contrat (article 1394 D) et refond les dispositions de l’article 1395 B bis en recentrant l’engagement de gestion sur le non‑retournement des parcelles et la préservation de la biodiversité tout en prévoyant la communication préfectorale des listes éligibles avant le 1er septembre. L’exposé des motifs indique que ces mesures visent à encourager la préservation des espaces naturels agricoles et forestiers et à renforcer les incitations environnementales. (identique à l’amendement I-2433)","auteur":"Mme Le Feur (Ensemble pour la République)","sort":"Rejeté","lien":"https://www.assemblee-nationale.fr/dyn/17/amendements/AMANR5L17PO838901B1906P1D1N001503"},{"numero":"I-1549","texte_plf":"APRÈS ART. 3","article":"CGI art. 150 U","resume":"Modifie le 1° du II de l’article 150 U du CGI en précisant la condition tenant à la durée de détention pour l’exonération de la résidence principale. La rédaction impose que le bien ait constitué la résidence principale pendant les cinq années précédant la cession, sauf si la cession intervient pour un motif impérieux familial, médical ou professionnel ou en vue d’acquérir une autre résidence principale. L’exposé des motifs indique que la mesure vise à lutter contre les ventes spéculatives consistant à revendre rapidement un logement déclaré résidence principale pour échapper à l’imposition des plus‑values.","auteur":"M. Dufau (Socialistes et apparentés)","sort":"Rejeté","lien":"https://www.assemblee-nationale.fr/dyn/17/amendements/AMANR5L17PO838901B1906P1D1N001549"},{"numero":"I-1561","texte_plf":"APRÈS ART. 29","article":"CGI art. 240, 1736","resume":"Modifie les articles 240 et 1736 du CGI. Impute la communication prévue à l’article 240 à « dans un délai de trente jours à la suite d’une demande de l’administration fiscale », supprime plusieurs alinéas de l’article 240 et adapte l’article 1736 en retirant la mention de l’article 240 dans la première phrase et en précisant que l’amende s’applique également à ceux ne respectant pas l’obligation prévue à l’article 240. L’exposé des motifs indique que la mesure vise à remplacer la DAS2 annuelle par une déclaration fournie « à la demande » dans un délai de 30 jours. (identique à l’amendement I-518)","auteur":"M. Pauget (Droite Républicaine)","sort":"Retiré","lien":"https://www.assemblee-nationale.fr/dyn/17/amendements/AMANR5L17PO838901B1906P1D1N001561"},{"numero":"I-1575","texte_plf":"APRÈS ART. 29","article":"CGI art. 54 quater","resume":"Modifie l’article 54 quater du CGI. Remplace l’obligation de produire le relevé des frais généraux « à l’appui de la déclaration de leurs résultats de chaque exercice » par une obligation de le produire « dans un délai de trente jours à la suite d’une demande de l’administration fiscale ». L’exposé des motifs indique que la mesure vise à simplifier les obligations déclaratives en supprimant la déclaration systématique tout en laissant la possibilité de communication sur demande. (identique à l’amendement I-519)","auteur":"M. Pauget (Droite Républicaine)","sort":"Retiré","lien":"https://www.assemblee-nationale.fr/dyn/17/amendements/AMANR5L17PO838901B1906P1D1N001575"},{"numero":"I-1587","texte_plf":"APRÈS ART. 29","article":"CGI art. 175","resume":"Modifie l’article 175 en remplaçant une précision de délai. Les mots « le deuxième jour ouvré suivant le 1er avril » sont remplacés par les mots « le 15 mai ». L’exposé des motifs précise que cette modification vise à aligner les échéances déclaratives professionnelles sur une date unique.","auteur":"M. Pauget (Droite Républicaine)","sort":"Retiré","lien":"https://www.assemblee-nationale.fr/dyn/17/amendements/AMANR5L17PO838901B1906P1D1N001587"},{"numero":"I-1590","texte_plf":"APRÈS ART. 27","article":"CGI art. 232, 1407 ter, 1407 quater, 1407 n, 1409, 1639 A, 1609 nonies C, 1609 quinquies A","resume":"Abroge les articles 232 et 1407 ter et crée l’article 1407 quater du CGI. L’article 1407 quater instaure une contribution unique sur les logements non affectés à la résidence principale dans les communes et EPCI où existe un déséquilibre marqué entre offre et demande, assise sur la valeur locative (article 1409), le taux étant fixé par les conseils municipaux avec, à défaut, un taux égal au taux de la taxe d’habitation sur les résidences secondaires délibéré en 2025 et un plafond annuel égal à six fois ce taux ; le produit est réparti entre l’État, les communes et les EPCI selon des modalités fixées par décret. L’exposé des motifs indique que la mesure vise à fusionner la taxe sur les logements vacants et la taxe sur les résidences secondaires afin d’inciter à la remise sur le marché des logements non principaux.","auteur":"M. Emmanuel Grégoire (Socialistes et apparentés)","sort":"Adopté","lien":"https://www.assemblee-nationale.fr/dyn/17/amendements/AMANR5L17PO838901B1906P1D1N001590"},{"numero":"I-1636","texte_plf":"APRÈS ART. 3","article":"CGI art. 80 quaterdecies","resume":"Il modifie le deuxième alinéa du III de l'article 80 quaterdecies du CGI. Il supprime la référence aux « conditions prévues au second alinéa du III de l’article L. 225‑197‑1 du code de commerce » et remplace la formulation « au profit de l’ensemble des salariés de l’entreprise » par « conformément au troisième alinéa du I de l’article L. 225‑197‑1 du code de commerce ». L'exposé des motifs indique que l'amendement a pour but de faciliter les regroupements de titulaires d'actions gratuites au sein d'une société de salariés lorsque l'attribution concerne une part importante des salariés, afin de favoriser l'actionnariat salarié dans les PME et ETI.","auteur":"Mme Olivia Grégoire (Ensemble pour la République)","sort":"Retiré","lien":"https://www.assemblee-nationale.fr/dyn/17/amendements/AMANR5L17PO838901B1906P1D1N001636"},{"numero":"I-1661","texte_plf":"APRÈS ART. 3","article":"CGI art. 125-0 A, 125‑0 A","resume":"L'amendement modifie l'article 125-0 A du CGI. Il prévoit que le transfert d'un contrat d'assurance-vie ou de capitalisation vers un autre organisme d'assurance ou établissement habilité n'entraîne pas la clôture du contrat au sens de l'article, que l'antériorité fiscale du contrat initial est conservée et que le transfert n'emporte pas l'imposition immédiate des produits capitalisés, les conditions d'application étant fixées par décret en Conseil d'État. L'exposé des motifs indique que la mesure vise à favoriser la mobilité de l'épargne et la concurrence entre organismes d'assurance sans perte des avantages fiscaux acquis.","auteur":"Mme Morel (Les Démocrates)","sort":"Rejeté","lien":"https://www.assemblee-nationale.fr/dyn/17/amendements/AMANR5L17PO838901B1906P1D1N001661"},{"numero":"I-1667","texte_plf":"APRÈS ART. 3","article":"CGI art. 167 bis","resume":"Abroge le 2 du VII de l’article 167 bis du CGI. Le dispositif supprime explicitement le 2° du VII de cet article. L’exposé précise que cette suppression vise, selon les auteurs, à rétablir le système d’Exit Tax antérieur à 2019.","auteur":"M. Coquerel (La France insoumise - NFP)","sort":"Rejeté","lien":"https://www.assemblee-nationale.fr/dyn/17/amendements/AMANR5L17PO838901B1906P1D1N001667"},{"numero":"I-1681","texte_plf":"APRÈS ART. 3","article":"CGI art. 167 bis","resume":"Modifie le 1 du I et abroge le 2 du VII de l’article 167 bis du CGI en réduisant le critère de durée de séjour et en supprimant des seuils de déclenchement. Le mot « six » est remplacé par « trois » au premier et au deuxième alinéa, les éléments conditionnels relatifs à la représentation d’au moins 50 % des bénéfices ou à une valeur globale excédant 800 000 € sont supprimés, et le 2 du VII est abrogé. L’exposé indique que ces modifications visent, selon leurs auteurs, à rétablir et à assurer la pleine application du système d’Exit Tax antérieur à 2019 pour lutter contre l’exil fiscal.","auteur":"Mme Feld (La France insoumise - NFP)","sort":"Rejeté","lien":"https://www.assemblee-nationale.fr/dyn/17/amendements/AMANR5L17PO838901B1906P1D1N001681"},{"numero":"I-1696","texte_plf":"APRÈS ART. 3","article":"CGI art. 150-0 A, 150‑0 A, 118, 120, 163 quinquies D, 758, 973, 164 B, 163 quinquies B, 200 A","resume":"Modifie l’article 150‑0 A du CGI et complète les articles 164 B, 163 quinquies B et 200 A. Soumet annuellement à l’impôt sur le revenu les plus‑values latentes constatées sur valeurs mobilières, droits sociaux et titres, impose aussi celles détenues dans un PEA et exclut celles afférentes aux titres détenus dans un plan d’épargne entreprise ou à un contrat d’assurance‑vie dans la limite d’un dépôt de 1 000 € ; la plus‑value est déterminée par différence de valeur d’une année sur l’autre selon les règles visées aux articles 758 et 973. L’exposé des motifs indique que la taxation annuelle vise à permettre à l’État de récupérer l’impôt sur les plus‑values et de lisser ses recettes.","auteur":"Mme Feld (La France insoumise - NFP)","sort":"Rejeté","lien":"https://www.assemblee-nationale.fr/dyn/17/amendements/AMANR5L17PO838901B1906P1D1N001696"},{"numero":"I-1756","texte_plf":"APRÈS ART. 27","article":"CGI art. 1636 B sexies","resume":"Modifie le 2° du I de l’article 1636 B sexies du CGI. Le texte permet au conseil municipal et aux instances délibérantes des EPCI dotés d’une fiscalité propre de fixer librement le taux de la taxe foncière sur les propriétés non bâties, sans contrainte de variation par rapport au taux de la taxe foncière sur les propriétés bâties. L’exposé des motifs indique que la mesure vise à donner davantage de souplesse aux collectivités pour ajuster leur fiscalité foncière aux réalités locales.","auteur":"M. Bataille (LIOT)","sort":"Retiré","lien":"https://www.assemblee-nationale.fr/dyn/17/amendements/AMANR5L17PO838901B1906P1D1N001756"},{"numero":"I-2013","texte_plf":"APRÈS ART. 3","article":"CGI art. 14-0 A, 14‑0 A, 200 A, 31, 2, 975","resume":"Insère l’article 14‑0 A, modifie l’article 200 A et complète l’article 975 du CGI pour permettre, sur option du contribuable, l’imposition au taux visé au B du 1 de l’article 200 A des revenus nets tirés de la location de logements neufs loués sous conditions et pour exonérer ces biens de l’IFI. Les conditions exigées sont que le logement soit neuf ou acquis/ livré neuf depuis moins de cinq ans, que le loyer soit encadré conformément au o du 1° du I de l’article 31 et aux plafonds de l’article 2 terdecies G de l’annexe 3, que la performance énergétique soit comprise entre A et D et que le bail soit d’une durée minimale de neuf mois, avec entrée en vigueur pour les compromis signés à compter du 1er janvier 2025. L’exposé des motifs précise que la mesure vise à créer un statut incitatif pour les propriétaires bailleurs favorisant la mise sur le marché de logements neufs à loyers encadrés, assorti d’une imposition au prélèvement forfaitaire unique pour ces revenus.","auteur":"M. de Courson (LIOT)","sort":"Rejeté","lien":"https://www.assemblee-nationale.fr/dyn/17/amendements/AMANR5L17PO838901B1906P1D1N002013"},{"numero":"I-2055","texte_plf":"APRÈS ART. 27","article":"CGI art. 232","resume":"Modifie la seconde phrase de l’article 232 du CGI en réécrivant son barème. Le taux de la taxe sur les logements vacants est fixé à 25 % la première année d’imposition, 50 % la seconde, 75 % la troisième et 100 % à compter de la quatrième année d’imposition. L’exposé des motifs indique que la mesure vise à augmenter progressivement la taxation des logements vacants afin d’inciter à leur mise sur le marché.","auteur":"M. Piquemal (La France insoumise - NFP)","sort":"Retiré","lien":"https://www.assemblee-nationale.fr/dyn/17/amendements/AMANR5L17PO838901B1906P1D1N002055"},{"numero":"I-2060","texte_plf":"APRÈS ART. 27","article":"CGI art. 232, 1407 bis, 1407 ter, 1409, 1639 A","resume":"Abroge l’article 232 et modifie les articles 1407 bis et 1407 ter du CGI. Les modifications prévoient notamment que la durée retenue pour certains dispositifs passe de « deux années » à « d’une année », qu’un logement est considéré comme vacant si sa durée d’occupation est inférieure à quatre-vingt-dix jours au cours de la période de référence, et que le taux de la taxe visée à l’article 1407 ter est fixé à 17 % la première année d’imposition et à 34 % à compter de la deuxième, le conseil municipal pouvant majorer la part lui revenant entre 5 % et 60 % dans les communes visées. L’exposé des motifs indique que ces mesures visent à fusionner les dispositifs de taxation des logements vacants et à simplifier et renforcer les outils fiscaux des collectivités pour lutter contre la vacance.","auteur":"Mme Feld (La France insoumise - NFP)","sort":"Retiré","lien":"https://www.assemblee-nationale.fr/dyn/17/amendements/AMANR5L17PO838901B1906P1D1N002060"},{"numero":"I-2061","texte_plf":"APRÈS ART. 3","article":"CGI art. 150 VC, 257","resume":"Modifie l’article 150 VC du CGI en excluant certains terrains à bâtir et en rétablissant une majoration de l’assiette des plus-values pour les détentions longues. Les terrains à bâtir définis au 1° du 2 du I de l’article 257 sont exclus du premier alinéa du I, et le II est rétabli de sorte que l’assiette de la plus-value sur ces terrains est majorée de 4 % pour chaque année de détention au‑delà de la cinquième, de 8 % pour chaque année au‑delà de la dix‑septième et de 12 % pour chaque année au‑delà de la vingt‑deuxième. L’exposé indique que l’objectif est de décourager la rétention foncière spéculative afin de libérer du foncier constructible.","auteur":"Mme Lejeune (La France insoumise - NFP)","sort":"Rejeté","lien":"https://www.assemblee-nationale.fr/dyn/17/amendements/AMANR5L17PO838901B1906P1D1N002061"},{"numero":"I-2063","texte_plf":"APRÈS ART. 27","article":"CGI art. 1407 ter, 232","resume":"Modifie le premier alinéa du I de l’article 1407 ter. La modification supprime la mention « Dans les communes classées dans les zones géographiques mentionnées au I de l’article 232, » et remplace le taux « 60 % » par les mots « 300 % notamment en fonction du nombre de locaux et des surfaces imposables, ». L’exposé des motifs indique que la mesure vise à étendre la taxe d’habitation sur les résidences secondaires à tout le territoire et à autoriser une majoration pouvant atteindre 300 %.","auteur":"M. Le Coq (La France insoumise - NFP)","sort":"Retiré","lien":"https://www.assemblee-nationale.fr/dyn/17/amendements/AMANR5L17PO838901B1906P1D1N002063"},{"numero":"I-2067","texte_plf":"APRÈS ART. 27","article":"CGI art. 1407 ter","resume":"Modifie le premier alinéa du I de l’article 1407 ter en remplaçant un taux. Le taux « 60 % » est remplacé par le taux « 100 % ». L’exposé des motifs précise que la modification vise à permettre aux communes concernées, dans les zones tendues, de majorer la taxe d’habitation sur les résidences secondaires jusqu’à 100 %.","auteur":"Mme Feld (La France insoumise - NFP)","sort":"Retiré","lien":"https://www.assemblee-nationale.fr/dyn/17/amendements/AMANR5L17PO838901B1906P1D1N002067"},{"numero":"I-2213","texte_plf":"APRÈS ART. 3","article":"CGI art. 92 B, 4 B, 150","resume":"Il modifie l'article 92 B du CGI et le III de l'article 150 VH bis. Il définit les crypto‑actifs de gouvernance et prévoit que les revenus tirés de leur attribution en rémunération de la participation au développement d'un protocole sont imposés au titre de l'année de leur cession, les gains nets en année de cession étant traités comme des bénéfices non commerciaux dans la limite de leur valeur d'acquisition (ou, si inférieure, de la valeur de cession), et adapte le III de l'article 150 VH bis pour tenir compte de ce régime spécifique. L'exposé des motifs indique que la mesure vise à différer l'imposition pour encourager la conservation des crypto‑actifs de gouvernance et soutenir le développement des protocoles informatiques en France.","auteur":"Mme Duby-Muller (Droite Républicaine)","sort":"Retiré","lien":"https://www.assemblee-nationale.fr/dyn/17/amendements/AMANR5L17PO838901B1906P1D1N002213"},{"numero":"I-2233","texte_plf":"APRÈS ART. 3","article":"CGI art. 163 bis G","resume":"Modifie le 2 du I de l’article 163 bis G du CGI en y ajoutant un alinéa relatif aux échanges sans soulte portant sur des titres souscrits en exercice de bons résultant d’une opération d’apport. En cas d’échange sans soulte de tels titres, l’impôt est dû au titre de l’année de disposition, de cession, de conversion au porteur ou de mise en location des titres reçus en échange, autre que cet échange, et, en cas d’échanges sans soulte successifs, au plus tard au titre de la dixième année suivant l’année de l’apport initial ; les conditions prévues au 1 du I sont appréciées à la date de disposition, de cession, de conversion ou de mise en location, et le dispositif s’applique aux apports réalisés à compter du 1er janvier 2026. L’exposé indique que la mesure a pour but de ne pas dissuader les opérations d’apport facilitant les réorganisations de l’actionnariat.","auteur":"M. Midy (Ensemble pour la République)","sort":"Adopté","lien":"https://www.assemblee-nationale.fr/dyn/17/amendements/AMANR5L17PO838901B1906P1D1N002233"},{"numero":"I-2236","texte_plf":"APRÈS ART. 3","article":"CGI art. 92 B, 4 B, 150","resume":"Il modifie l'article 92 B du CGI et le III de l'article 150 VH bis. Il définit les crypto‑actifs de gouvernance et prévoit que les revenus tirés de leur attribution en rémunération de la participation au développement d'un protocole sont imposés au titre de l'année de leur cession, les gains nets en année de cession étant traités comme des bénéfices non commerciaux dans la limite de leur valeur d'acquisition (ou, si inférieure, de la valeur de cession), et adapte le III de l'article 150 VH bis pour tenir compte de ce régime spécifique. L'exposé des motifs indique que la mesure vise à différer l'imposition pour encourager la conservation des crypto‑actifs de gouvernance et soutenir le développement des protocoles informatiques en France. (identique à l’amendement I-2213)","auteur":"M. Midy (Ensemble pour la République)","sort":"Retiré","lien":"https://www.assemblee-nationale.fr/dyn/17/amendements/AMANR5L17PO838901B1906P1D1N002236"},{"numero":"I-2261","texte_plf":"APRÈS ART. 27","article":"CGI art. 1395","resume":"Modifie l’article 1395 en y insérant un 1° quater. Le nouveau 1° quater exonère de taxe les terrains classés au cadastre en nature de bois et forêts appartenant à un même propriétaire résultant de la réunion d’au moins deux parcelles lorsque la surface après fusion est inférieure ou égale à 10 hectares, l’exonération étant applicable pendant dix ans à compter de la date de publication de l’opération de fusion au service de la publicité foncière. L’exposé des motifs indique que la mesure vise à encourager le regroupement parcellaire pour réduire la morcellement et favoriser une gestion forestière économiquement viable.","auteur":"M. Castellani (LIOT)","sort":"Retiré","lien":"https://www.assemblee-nationale.fr/dyn/17/amendements/AMANR5L17PO838901B1906P1D1N002261"},{"numero":"I-2297","texte_plf":"APRÈS ART. 3","article":"CGI art. 150 U","resume":"Modifie le II de l’article 150 U du CGI en reportant les dates d’application des dispositions des 7° et 8° au 31 décembre 2027. Les mentions « 31 décembre 2025 » sont remplacées par « 31 décembre 2027 » pour les deux alinéas visés. L’exposé des motifs indique que l’objectif est de prolonger le régime d’exonération afin d’encourager la création de logements sociaux.","auteur":"M. Peu (Gauche Démocrate et Républicaine)","sort":"Non soutenu","lien":"https://www.assemblee-nationale.fr/dyn/17/amendements/AMANR5L17PO838901B1906P1D1N002297"},{"numero":"I-2318","texte_plf":"APRÈS ART. 3","article":"CGI art. 885 A ; CGI/LPF/CIBS art. 6, 885 N, 754 B, 669, 767, 751, 792‑0 bis, 795, 795‑0 A, 787 B, 793, 795 A, L. 416‑1, L. 418‑1, 885 P, 885 Q, 885 O, 885 W, 817 A, 107, 885‑0 V, L. 214‑28, 62, 39, L. 214‑164, L. 214‑166, L. 3334‑1, 163, 750 ter, 220 quater, 885 G, L. 411‑37, 761, 726, L. 423‑25, 2, L. 421‑1, 199, L. 214‑31, 163 quinquies D, 199 undecies A, 199 undecies B, L. 233‑3, 200, L. 5132‑5, L. 5132‑7, L. 5132‑15, L. 5213‑13, L. 1253‑1, L. 6325‑17, L. 719‑12, 1649 nonies, L. 365‑1, 156, L. 64, 170, 204, 4 B, 164 D, 1723 ter, 1658, 1681 A, 1715, 1717, 1929, L. 18, L. 23 A, L. 59 B, L. 66, L. 72 A, L. 102 E, L. 107 B, L. 139 B, L. 180, 982, L. 181‑0 A, 1649 A, L. 183 A, L. 199, L. 253, L. 212‑3, L. 214‑121, 885 I","resume":"Modifie et rétablit le chapitre I bis du titre IV du livre premier du CGI en réinstituant un impôt de solidarité sur la fortune sous une série d’articles (885 A, 885 C, 885 D, 885 E, 885 F, 885 G, 885 G bis, 885 G ter, 885 G quater). Le nouvel ensemble fixe le seuil d’imposition à 1 300 000 € pour les personnes physiques, prévoit une imposition commune des couples mariés et partenaires de PACS sauf exceptions, précise que les biens professionnels sont pris en compte après application d’un abattement de 2 000 000 € et rétablit des règles d’assiette et d’évaluation inspirées des droits de mutation par décès. L’exposé indique que la mesure a pour objet de rétablir un ISF renforcé, d’en accroître la progressivité et d’introduire une dimension climatique dans l’imposition du patrimoine.","auteur":"M. Tavel (La France insoumise - NFP)","sort":"Rejeté","lien":"https://www.assemblee-nationale.fr/dyn/17/amendements/AMANR5L17PO838901B1906P1D1N002318"},{"numero":"I-2359","texte_plf":"APRÈS ART. 3","article":"CGI art. 885 AA ; CGI/LPF art. 6, 669, 767, 1094‑1, 751, 792‑0 bis, 795, 795‑0 A, 754 B, 726, 1A, 964, 1380, 1407, 235 ter, L. 136‑1, 223 sexies, 204, 4 B, 164 D, 1716 bis, 1723 ter, 1715, 1717, L. 269","resume":"Il insère un chapitre Ier ter au titre IV du livre Ier du CGI et crée les articles 885 AA à 885 AG relatif à un « impôt plancher sur la fortune ». L'impôt s'applique lorsque la valeur des actifs visés excède 100 000 000 €, prévoit un régime d'assujettissement apprécié au 1er janvier, une assiette nette au 1er janvier, des règles d'intégration des primes d'assurance et des biens en fiducie ou trust, et institue une taxe due lors du transfert de domicile pour les contribuables domiciliés en France au moins six des dix années précédant le transfert, au tarif égal à dix fois celui prévu à l'article 885 AL avec possibilité d'échéonnement jusqu'à dix ans. L'exposé des motifs présente cette taxe comme un prélèvement plancher de 2 % destiné à atteindre une plus grande contribution des très hauts patrimoines.","auteur":"M. Vallaud (Socialistes et apparentés)","sort":"Rejeté","lien":"https://www.assemblee-nationale.fr/dyn/17/amendements/AMANR5L17PO838901B1906P1D1N002359"},{"numero":"I-2360","texte_plf":"APRÈS ART. 3","article":"CGI art. 885 A ; CGI/LPF art. 6, 885 N, 754 B, 669, 767, 751, 792‑0 bis, 795, 795‑0 A, 787 B, 793, 795 A, L. 416‑1, L. 418‑1, 885 P, 885 Q, 885 O, 885 W, 817 A, 107, 885‑0 V, L. 214‑28, 62, 39, L. 214‑164, L. 214‑166, L. 3334‑1, 163, 750 ter, 220 quater, 885 G, L. 411‑37, 761, 726, 2, L. 421‑1, 199, L. 214‑31, 163 quinquies D, 199 undecies A, 199 undecies B, L. 233‑3, 200, L. 5132‑5, L. 5132‑7, L. 5132‑15, L. 5213‑13, L. 1253‑1, L. 6325‑17, L. 719‑12, 1649 nonies, L. 365‑1, 156, L. 64, 170, 204, 4 B, 164 D, 1723 ter, 1658, 1681 A, 1715, 1717, 1929, L. 18, L. 23 A, L. 59 B, L. 66, L. 72 A, L. 102 E, L. 107 B, L. 139 B, L. 180, 982, L. 181‑0 A, 1649 A, L. 183 A, L. 199, L. 253, L. 212‑3, L. 214‑121, 885 I","resume":"Il rétablit le chapitre I bis du titre IV du livre Ier du CGI et crée ou précise les articles 885 A, 885 C à 885 G quater instituant un impôt de solidarité sur la fortune. L'assujettissement est fixé au-delà d'une valeur des biens de 1 300 000 €, les personnes domiciliées en France étant imposées sur leurs biens mondiaux (avec la règle des cinq années civiles pour les nouveaux domiciliés), les non‑résidents sur leurs biens situés en France, et les biens professionnels étant pris en compte après application d'un abattement de 2 000 000 euros ; le dispositif fixe par ailleurs diverses règles d'assiette et de présomptions de propriété. L'exposé des motifs précise que cet amendement vise à rétablir et renforcer l'ISF en attendant l'introduction de sa composante climatique.","auteur":"M. Le Coq (La France insoumise - NFP)","sort":"Rejeté","lien":"https://www.assemblee-nationale.fr/dyn/17/amendements/AMANR5L17PO838901B1906P1D1N002360"},{"numero":"I-2378","texte_plf":"APRÈS ART. 3","article":"CGI art. 885 A ; CGI/CIBS art. 6, 754 B, 669, 767, 751, 792‑0 bis, 795, 795‑0 A, 787 B, 793, 795 A, L. 416‑1, L. 418‑1, 885 P, 885 Q, 750 ter, 885 O, 62, 220 quater, 885 G, L. 411‑37, 761, 726, 885 V, L. 173‑1, L. 423‑25, L. 424‑1, 885 W, 885 N, 223 sexies, 170, 204, 4 B, 164 D, 1723 ter, 1658, 1681 A, 1715, 1717, 1929","resume":"Rétablit le chapitre I bis du titre IV du livre Ier du CGI et institue un impôt annuel de solidarité sur la fortune. Le dispositif créé une série d’articles (notamment 885 A et suivants) imposant les personnes physiques dont la valeur nette taxable du patrimoine est supérieure à 1 000 000 €, définissant l’assiette au 1er janvier de l’année, prévoyant l’imposition commune des couples mariés et des partenaires liés par PACS, et rendant applicables à cet impôt certaines règles et sanctions prévues pour les droits de mutation par décès (avec renvoi à l’article 754 B pour certaines règles déclaratives et de recouvrement). L’exposé des motifs indique que cette création vise à rétablir un ISF climatique et à mieux prendre en compte la soutenabilité budgétaire et environnementale.","auteur":"M. Coquerel (La France insoumise - NFP)","sort":"Rejeté","lien":"https://www.assemblee-nationale.fr/dyn/17/amendements/AMANR5L17PO838901B1906P1D1N002378"},{"numero":"I-2382","texte_plf":"APRÈS ART. 3","article":"CGI art. 117 quater","resume":"Il modifie l'article 117 quater du CGI. Il remplace le taux de 12,8 % par le taux de 22,8 % au niveau prévu à la fin du premier alinéa du 1 du I de cet article. L'exposé des motifs indique que l'augmentation de 10 points du prélèvement forfaitaire unique vise, selon ses auteurs, à rétablir l'équité fiscale et à accroître les recettes publiques.","auteur":"M. Coquerel (La France insoumise - NFP)","sort":"Rejeté","lien":"https://www.assemblee-nationale.fr/dyn/17/amendements/AMANR5L17PO838901B1906P1D1N002382"},{"numero":"I-2383","texte_plf":"APRÈS ART. 3","article":"CGI art. 117 quater","resume":"L'amendement modifie l'article 117 quater du CGI. Il remplace, à la fin du premier alinéa du 1 du I, le taux « 12,8 % » par le taux « 17,8 % ». L'exposé des motifs indique que la hausse de 5 points vise à rétablir une progressivité de l'impôt sur le capital.","auteur":"M. Le Coq (La France insoumise - NFP)","sort":"Rejeté","lien":"https://www.assemblee-nationale.fr/dyn/17/amendements/AMANR5L17PO838901B1906P1D1N002383"},{"numero":"I-2384","texte_plf":"APRÈS ART. 3","article":"CGI art. 117 quater","resume":"Modifie le premier alinéa du 1 du I de l’article 117 quater du CGI en relevant le taux du prélèvement forfaitaire unique. Le taux de 12,8 % est remplacé par 15,8 %. L’exposé des motifs indique que la hausse de 3 points vise à rétablir une progressivité de l’imposition du capital.","auteur":"Mme Feld (La France insoumise - NFP)","sort":"Rejeté","lien":"https://www.assemblee-nationale.fr/dyn/17/amendements/AMANR5L17PO838901B1906P1D1N002384"},{"numero":"I-2389","texte_plf":"APRÈS ART. 3","article":"CGI art. 964","resume":"Il institue une contribution exceptionnelle assise selon les règles de l'impôt sur la fortune immobilière et renvoie à l'article 964 du CGI pour son établissement, son contrôle et son recouvrement. La contribution s'applique à la valeur nette au 1er janvier du patrimoine des personnes physiques et de leurs enfants mineurs et est calculée selon un barème de 1,7 % pour la fraction comprise entre 3 et 5 millions d'euros, 2,1 % pour la fraction comprise entre 5 et 10 millions d'euros et 3,5 % pour la fraction excédant 10 millions d'euros, la durée d'application étant limitée jusqu'au 31 décembre 2027. L'exposé des motifs indique que la mesure s'inspire de l'impôt exceptionnel espagnol sur les grandes fortunes pour faire contribuer les patrimoines élevés au financement d'investissements publics.","auteur":"M. Coquerel (La France insoumise - NFP)","sort":"Rejeté","lien":"https://www.assemblee-nationale.fr/dyn/17/amendements/AMANR5L17PO838901B1906P1D1N002389"},{"numero":"I-2401","texte_plf":"APRÈS ART. 5","article":"CGI art. 31 ; CGI/CIBS art. 35 bis, 38, 39 quinquies, 39 quinquies G, 39, 73, 73 A, 75‑0 A, 80 bis, 80, 81, 81 A, 84 A, 100 bis, 150 ter, 150‑0 A, 150‑0 D, 150 U, 150, 157, 163 bis C, 163 bis G, 163 bis H, 199 ter U, 200 A, 206, 207, 208, 208 C, 219, 220 Z, 223 H, 223 O, 235 ter, 238, 239 octies, 244 bis C, 244 quater W, 278 sexies, 278 sexies A, 278‑0 bis P, 722 bis, 726, 730 bis, 730 ter, 730 quinquies, 732, 732 ter, 749, 750 bis B, 750 bis C, 775 bis, 775 sexies, 776 quater, 790 A, 793, 793 ter, 794, 795, 795‑0 A, 796, 796 bis, 796‑0 quinquies, 797, 809, 810, 828, 972 ter, 975, 1020, 1030, 1031, 1039, 1042, 1043 B, 1051, 1135 ter, L. 312‑48, L. 312‑58‑1, L. 312‑79, L. 312‑85, L. 312‑87, L. 421‑66, L. 421‑70‑1, L. 421‑74, L. 421‑77, L. 421‑78, L. 421‑78‑1, L. 421‑79, L. 421‑79‑1, L. 421‑81‑1, L. 421‑149, L. 421‑150, L. 421‑152, L. 421‑153, L. 421‑154, L. 421‑155","resume":"Abroge un large ensemble d’articles visés du code général des impôts et du code des impositions sur les biens et services. Le dispositif prévoit l’abrogation, pour le CGI, de nombreuses dispositions listées (notamment articles 31, 35 bis I et II, 38 n°5, 39 quinquies et variantes, 73, 73 A, 75‑0 A, 80 bis, 81 A, 84 A, 100 bis, 150 ter, 150‑0 A et ses paragraphes, 150 U, 157, 163 bis C, 163 bis G, 163 bis H, 199 ter U, 200 A (5,6,6 bis), 206 1 bis, 207 (9,10,11), 208 et 208 C, 219 a, 220 Z quater, 223 H, 223 O, 235 ter ZG, 238, 239 octies, 244 bis C, 244 quater W, 278 sexies (1 du IV), 278 sexies‑0 A, 278 sexies A, 278‑0 bis P, 722 bis, 726 II, 730 bis, 730 ter, 730 quinquies, 732, 732 ter, 749, 750 bis B, 750 bis C, 775 bis, 775 sexies, 776 quater, 790 A, 790 A bis, 793 (suppression de 4°,5°,6°,8° au 2), 793 ter, 794, 795 (suppression de plusieurs paragraphes), 795‑0 A, 796 (au I 1° à 7°), 796 bis, 796‑0 quinquies, 797, 809 (3° du I, I bis, II), 810 III, 828 (I 2° et 4°), 972 ter, 975, 1020, 1030, 1031, 1039, 1042, 1043 B, 1051 1°, 1135 ter) et, pour le code des impositions sur les biens et services, l’abrogation des articles L. 312‑48, L. 312‑58‑1, L. 312‑79, L. 312‑85, L. 312‑87, L. 421‑66, L. 421‑70‑1, L. 421‑74, L. 421‑77 à L. 421‑79‑1, L. 421‑81‑1 et L. 421‑149 à L. 421‑155. L’exposé des motifs indique que cet amendement vise à supprimer l’ensemble des niches fiscales dont le coût est, selon l’exposé, non chiffrable par l’administration fiscale.","auteur":"Mme Gérard (Horizons & Indépendants)","sort":"Tombé","lien":"https://www.assemblee-nationale.fr/dyn/17/amendements/AMANR5L17PO838901B1906P1D1N002401"},{"numero":"I-2428","texte_plf":"APRÈS ART. 27","article":"CGI art. 1383","resume":"Modifie l’article 1383 du CGI en supprimant la référence aux « constructions nouvelles » et en insérant la possibilité pour l’autorité compétente de supprimer l’exonération, puis abroge le III. Supprime les mots « constructions nouvelles » au I et au II, insère après « revient, » les mots « supprimer l’exonération ou », abroge le III et rend ces modifications applicables aux impositions dues au titre de l’année 2026. L’exposé des motifs indique que l’objectif est de supprimer des niches fiscales favorisant l’artificialisation des sols.","auteur":"Mme de Pélichy (LIOT)","sort":"Retiré","lien":"https://www.assemblee-nationale.fr/dyn/17/amendements/AMANR5L17PO838901B1906P1D1N002428"},{"numero":"I-2430","texte_plf":"APRÈS ART. 27","article":"CGI art. 1530, 1639 A","resume":"Modifie l’article 1530 du CGI et adapte les modalités de mise en œuvre liées aux délibérations prévues à l’article 1639 A. Précise que, sauf délibération contraire prise dans les conditions prévues au I de l’article 1639 A bis, les communes perçoivent une taxe annuelle sur les friches commerciales, remplace « instituer » par « percevoir », inverse l’obligation de communication en prévoyant que l’administration communique au conseil municipal avant le 1er mars (au lieu du 1er octobre) et fixe un barème de taux de 20 % la 1ère année à 60 % à compter de la 5e année avec possibilité de minorations jusqu’à moitié ; application à compter du 1er janvier 2026. L’exposé des motifs indique que la mesure vise à généraliser et renforcer la taxe sur les friches commerciales pour encourager le recyclage urbain et réduire l’artificialisation des sols.","auteur":"Mme de Pélichy (LIOT)","sort":"Retiré","lien":"https://www.assemblee-nationale.fr/dyn/17/amendements/AMANR5L17PO838901B1906P1D1N002430"},{"numero":"I-2431","texte_plf":"APRÈS ART. 27","article":"CGI art. 1530 ter, 1639 A, 1500, 1447, 1400, 1388","resume":"Crée un nouvel article 1530 ter du CGI instituant une taxe sur les friches industrielles et fixe son assiette, son redevable et son taux. Instaure, sauf délibération contraire prise dans les conditions prévues au I de l’article 1639 A bis, une taxe annuelle due pour les biens évalués en application de l’article 1500 qui ne sont plus affectés à une activité entrant dans le champ de la CFE depuis au moins deux ans et restés inoccupés, assise sur le revenu net défini par l’article 1388, acquittée par le redevable de la taxe foncière au sens de l’article 1400, avec un taux progressif fixé à 20 % la première année, 30 % la deuxième, 40 % la troisième, 50 % la quatrième et 60 % à compter de la cinquième année, et des règles de contrôle, recouvrement et dégrèvements alignées sur celles de la taxe foncière. L’exposé des motifs indique que l’objectif est de doter les collectivités d’un outil fiscal pour dissuader l’inactivité foncière industrielle, sauf lorsqu’elle est involontaire.","auteur":"Mme de Pélichy (LIOT)","sort":"Retiré","lien":"https://www.assemblee-nationale.fr/dyn/17/amendements/AMANR5L17PO838901B1906P1D1N002431"},{"numero":"I-2433","texte_plf":"APRÈS ART. 10","article":"CGI art. 15, L. 411‑1, 1394 B, 1394 D, 1395 B","resume":"Rétablit le I de l’article 15 et modifie les articles 1394 B bis, 1394 D et 1395 B bis du CGI. Exonère de l’impôt sur le revenu les revenus issus d’un bail rural, remplace le taux « 30 % » par « 50 % » à la fin du I de l’article 1394 B bis, prévoit que les propriétés non bâties ayant conclu certains contrats sont exonérées de taxe foncière sur les propriétés non bâties pendant toute la durée du contrat (article 1394 D) et refond les dispositions de l’article 1395 B bis en recentrant l’engagement de gestion sur le non‑retournement des parcelles et la préservation de la biodiversité tout en prévoyant la communication préfectorale des listes éligibles avant le 1er septembre. L’exposé des motifs indique que ces mesures visent à encourager la préservation des espaces naturels agricoles et forestiers et à renforcer les incitations environnementales.","auteur":"Mme de Pélichy (LIOT)","sort":"Retiré","lien":"https://www.assemblee-nationale.fr/dyn/17/amendements/AMANR5L17PO838901B1906P1D1N002433"},{"numero":"I-2470","texte_plf":"APRÈS ART. 36","article":"CGI art. 1635 bis N","resume":"Modifie l’article 1635 bis N en remplaçant un montant fixé. Le montant « 9 € » est remplacé par le montant « 30 € ». L’exposé des motifs indique que cette hausse des droits payés par les chasseurs vise à financer un fonds d’indemnisation pour les victimes d’accidents de la chasse et la protection de la biodiversité.","auteur":"M. Caron (La France insoumise - NFP)","sort":"Retiré","lien":"https://www.assemblee-nationale.fr/dyn/17/amendements/AMANR5L17PO838901B1906P1D1N002470"},{"numero":"I-2473","texte_plf":"ART. 3","article":"CGI art. 223 VJ bis","resume":"Crée l’article 223 VJ bis du CGI instituant une taxe sur les bénéfices non distribués. La taxe est due au taux de 20 % sur l’excédent des bénéfices non distribués au-delà d’un seuil fixé à 250 000 € pour les sociétés industrielles et commerciales et à 150 000 € pour les sociétés de services, les bénéfices non distribués étant définis comme le bénéfice net diminué des distributions, des mises en réserve, des reports à nouveau et des montants justifiés par des besoins raisonnables définis par décret. L’exposé vise à encourager la redistribution des bénéfices, limiter les stratégies d’optimisation fiscale fondées sur la thésaurisation et préserver la trésorerie nécessaire au développement des entreprises.","auteur":"M. Philippe Brun (Socialistes et apparentés)","sort":"Rejeté","lien":"https://www.assemblee-nationale.fr/dyn/17/amendements/AMANR5L17PO838901B1906P1D1N002473"},{"numero":"I-2475","texte_plf":"APRÈS ART. 3","article":"CGI art. 31","resume":"Rétablit dans leur rédaction antérieure à la loi n° 2017‑1837 du 30 décembre 2017 les articles du CGI modifiés et abrogés par l’article 31 de cette loi. Le dispositif remet les textes concernés et les dispositions nécessitant coordination dans leur rédaction antérieure à la promulgation de la loi précitée. L’exposé indique que l’objectif est de restaurer l’ISF selon les modalités en vigueur jusqu’en 2017, en excluant notamment les biens professionnels.","auteur":"M. Philippe Brun (Socialistes et apparentés)","sort":"Rejeté","lien":"https://www.assemblee-nationale.fr/dyn/17/amendements/AMANR5L17PO838901B1906P1D1N002475"},{"numero":"I-2532","texte_plf":"APRÈS ART. 7","article":"CGI art. 244 quater X","resume":"Modifie l’article 244 quater X du CGI en étendant le type de prestations admises dans son champ. Complète le deuxième alinéa du a du 1 du I pour inclure, dans les établissements visés aux I et II de l’article L. 313‑12 du code de l’action sociale et des familles, des prestations de nature médicale ; le I n’est applicable qu’aux sommes venant en déduction de l’impôt dû. L’exposé des motifs indique que la modification a pour objet de permettre aux organismes HLM de bénéficier du crédit d’impôt pour la création d’EHPAD dans les départements et régions d’outre‑mer afin de mieux répondre aux besoins liés au vieillissement de la population outre‑mer.","auteur":"M. Nadeau (Gauche Démocrate et Républicaine)","sort":"Adopté","lien":"https://www.assemblee-nationale.fr/dyn/17/amendements/AMANR5L17PO838901B1906P1D1N002532"},{"numero":"I-2558 (Rect)","texte_plf":"APRÈS ART. 3","article":"CGI art. 885 AA ; CGI/LPF art. 6, 669, 767, 1094‑1, 751, 792‑0 bis, 795, 795‑0 A, 754 B, 726, 1A, 964, 1380, 1407, 235 ter, L. 136‑1, 223 sexies, 204, 4 B, 164 D, 1716 bis, 1723 ter, 1715, 1717, L. 269","resume":"Insère un chapitre I ter et crée les articles 885 AA à 885 AG du CGI instituant un impôt plancher sur la fortune. L’assujettissement vise les personnes dont la valeur des actifs excède 100 millions d’euros, prévoit que les contribuables domiciliés en France pendant au moins six des dix années précédant un transfert hors de France sont imposables lors de ce transfert à un tarif égal à dix fois celui prévu au II, avec possibilité d’échelonnement du paiement sur dix ans, et reprend des règles de détermination et d’évaluation de l’assiette calquées sur les droits de mutation par décès. L’exposé des motifs indique que l’objectif est d’aligner la contribution des très hauts patrimoines sur celle des classes moyennes, autour d’un taux de référence de 5,5 % du patrimoine.","auteur":"M. Le Coq (La France insoumise - NFP)","sort":"Rejeté","lien":"https://www.assemblee-nationale.fr/dyn/17/amendements/AMANR5L17PO838901B1906P1D1N002558"},{"numero":"I-2574","texte_plf":"APRÈS ART. 3","article":"CGI art. 885 AA ; CGI/LPF art. 6, 669, 767, 1094‑1, 751, 792‑0 bis, 795, 795‑0 A, 754 B, 726, 1A, 964, 1380, 1407, 235 ter, L. 136‑1, 223 sexies, 204, 4 B, 164 D, 1716 bis, 1723 ter, 1715, 1717, L. 269","resume":"Il insère un chapitre Ier ter au titre IV du livre Ier du CGI et crée les articles 885 AA à 885 AG relatif à un « impôt plancher sur la fortune ». L'impôt s'applique lorsque la valeur des actifs visés excède 100 000 000 €, prévoit un régime d'assujettissement apprécié au 1er janvier, une assiette nette au 1er janvier, des règles d'intégration des primes d'assurance et des biens en fiducie ou trust, et institue une taxe due lors du transfert de domicile pour les contribuables domiciliés en France au moins six des dix années précédant le transfert, au tarif égal à dix fois celui prévu à l'article 885 AL avec possibilité d'échéonnement jusqu'à dix ans. L'exposé des motifs présente cette taxe comme un prélèvement plancher de 2 % destiné à atteindre une plus grande contribution des très hauts patrimoines. (identique à l’amendement I-2359)","auteur":"Mme Feld (La France insoumise - NFP)","sort":"Rejeté","lien":"https://www.assemblee-nationale.fr/dyn/17/amendements/AMANR5L17PO838901B1906P1D1N002574"},{"numero":"I-2592","texte_plf":"APRÈS ART. 29","article":"CGI art. 1740","resume":"Complète l’article 1740 du CGI en ajoutant un troisième alinéa instituant une nouvelle sanction. Toute personne morale qui, pour obtenir pour elle-même ou pour autrui des avantages fiscaux, a volontairement fourni de fausses informations ou n’a volontairement pas respecté des engagements est redevable d’une amende égale au montant de l’avantage fiscal indûment demandé, sans préjudice des sanctions de droit commun, un décret en Conseil d’État devant préciser les modalités avant le 1er avril 2026. L’exposé des motifs indique que la mesure vise à sanctionner les fausses déclarations visant à obtenir des niches fiscales ou des crédits d’impôt.","auteur":"Mme Lejeune (La France insoumise - NFP)","sort":"Retiré","lien":"https://www.assemblee-nationale.fr/dyn/17/amendements/AMANR5L17PO838901B1906P1D1N002592"},{"numero":"I-2642","texte_plf":"APRÈS ART. 3","article":"CGI art. 91, 154 bis","resume":"Il rétablit l'article 91 du CGI et précise sa date d'entrée en vigueur. L'article soumet à l'impôt sur le revenu les sommes perçues par les ayants droit d'un titulaire de plan d'épargne retraite décédé après l'échéance au titre des versements déduits, accorde un abattement équivalent pour le calcul des droits de mutation, et dispose que l'entrée en vigueur intervient le 1er janvier 2026. L'exposé des motifs indique que la mesure vise à récupérer l'avantage fiscal lié à la déduction des versements PER en cas de décès du souscripteur. (identique à l’amendement I-3255)","auteur":"M. Le Coq (La France insoumise - NFP)","sort":"Rejeté","lien":"https://www.assemblee-nationale.fr/dyn/17/amendements/AMANR5L17PO838901B1906P1D1N002642"},{"numero":"I-2644","texte_plf":"APRÈS ART. 3","article":"CGI art. 757 B","resume":"Modifie le I de l’article 757 B du CGI et implique une modification corrélée de l’article L.132‑13 du code des assurances. Supprime la mention « à concurrence de la fraction des primes versées après l’âge de soixante‑dix ans » et le second alinéa du I de l’article 757 B, et remplace la formulation de l’article L.132‑13 par « pas soumis aux règles de ». L’exposé des motifs précise que la mesure vise à soumettre les produits de l’assurance‑vie au barème de droit commun des droits de succession.","auteur":"M. Coquerel (La France insoumise - NFP)","sort":"Rejeté","lien":"https://www.assemblee-nationale.fr/dyn/17/amendements/AMANR5L17PO838901B1906P1D1N002644"},{"numero":"I-2793","texte_plf":"APRÈS ART. 3","article":"CGI art. 150 VC, 200 B, 200 A, 257, 150 U","resume":"Modifie l’article 150 VC et l’article 200 B du CGI en remplaçant l’abattement pour durée de détention par une actualisation du prix d’acquisition. Le prix d’acquisition est indexé sur le dernier indice des prix à la consommation hors tabac, les alinéas relatifs aux abattements actuels sont supprimés et la réforme s’applique aux cessions de terrains à bâtir à compter du 1er janvier 2027 et aux autres biens visés à compter du 1er janvier 2028. L’exposé des motifs vise à lutter contre la rétention et la spéculation immobilières en supprimant l’incitation à conserver un bien jusqu’à l’exonération totale.","auteur":"Mme Le Meur (Ensemble pour la République)","sort":"Non soutenu","lien":"https://www.assemblee-nationale.fr/dyn/17/amendements/AMANR5L17PO838901B1906P1D1N002793"},{"numero":"I-2815","texte_plf":"APRÈS ART. 3","article":"CGI art. 200 A, 150‑0 A, 158","resume":"Modifie l’article 200 A du CGI pour intégrer les gains nets visés à l’article 150‑0 A dans le revenu net global défini à l’article 158. Les gains nets obtenus dans les conditions prévues à l’article 150‑0 A sont désormais pris en compte pour la détermination du revenu net global. L’exposé des motifs indique que la finalité est de supprimer le prélèvement forfaitaire unique et de rétablir la progressivité de l’imposition des revenus du capital.","auteur":"M. Arnaud Bonnet (Écologiste et Social)","sort":"Rejeté","lien":"https://www.assemblee-nationale.fr/dyn/17/amendements/AMANR5L17PO838901B1906P1D1N002815"},{"numero":"I-2845","texte_plf":"ART. 5","article":"CGI art. 199, 73 B","resume":"Modifie l’article 199 vicies A du CGI en transformant la réduction d’impôt applicable au dispositif en un crédit d’impôt et en adaptant ses conditions d’application. Le crédit s’applique aux ventes sans différé (contrat authentique, évaluation par un organisme comptable, paiement en numéraire, société gérée majoritairement par des associés exploitants), la cession devant intervenir entre le 1er janvier 2026 et le 31 décembre 2035, et il est fixé à 50 % avec des formules et plafonds annuels prévus : 50 % des intérêts perçus dans la limite de 15 000 € pour les célibataires et 20 000 € pour les mariés, et 50 % du prix de vente dans la limite de 20 000 € pour les célibataires et 25 000 € pour les mariés. L’exposé des motifs indique que l’objectif est de favoriser la transmission d’exploitations agricoles à des jeunes et de moderniser un dispositif peu utilisé. (identique à l’amendement I-3709)","auteur":"M. Fabrice Brun (Droite Républicaine)","sort":"Retiré","lien":"https://www.assemblee-nationale.fr/dyn/17/amendements/AMANR5L17PO838901B1906P1D1N002845"},{"numero":"I-2955","texte_plf":"APRÈS ART. 27","article":"CGI art. 1636 B sexies","resume":"Modifie l’article 1636 B sexies du CGI pour supprimer la liaison entre certains taux. Le texte supprime, au 1° du b du 1 du I, la mention liant le taux de la taxe d’habitation sur les résidences secondaires au taux de la taxe foncière sur les propriétés bâties et adapte l’accord grammatical des alinéas concernés. L’exposé des motifs précise que la mesure a pour objet de délier les taux afin de permettre aux communes d’agir sur la THRS sans répercuter la variation sur la TFPB.","auteur":"M. Bataille (LIOT)","sort":"Retiré","lien":"https://www.assemblee-nationale.fr/dyn/17/amendements/AMANR5L17PO838901B1906P1D1N002955"},{"numero":"I-3096","texte_plf":"ART. 3","article":"CGI art. 235 ter C","resume":"Modifie la rédaction visée en complétant la seconde phrase de l’alinéa 108. Après la référence « IV », il insère les mots « de l’article 235 ter C du code général des impôts ». L’exposé des motifs qualifie cet amendement de rédactionnel.","auteur":"M. Juvin (Droite Républicaine)","sort":"Rejeté","lien":"https://www.assemblee-nationale.fr/dyn/17/amendements/AMANR5L17PO838901B1906P1D1N003096"},{"numero":"I-3210","texte_plf":"APRÈS ART. 3","article":"CGI art. 81, 163, 158, 83, 154 bis, 163 bis, L. 225‑1","resume":"Modifie les articles 81 et 158 et complète l’article 163 quinvicies du CGI pour supprimer les avantages fiscaux applicables aux versements effectués sur un plan d’épargne retraite (PER) à compter du soixante‑dixième anniversaire du titulaire. À compter du 1er janvier 2026, les dispositions favorables (a bis, a ter, b bis du 18° et 18° bis de l’article 81, etc.) ne s’appliquent pas aux versements effectués par le titulaire du PER ou du sous‑compte français du produit paneuropéen d’épargne‑retraite individuelle à compter du jour de son soixante‑dixième anniversaire. L’exposé des motifs prévoit que les prestations issues de ces versements seront traitées fiscalement comme les prestations issues de versements non déductibles, avec exonération en capital pour la part correspondant aux versements et application du prélèvement forfaitaire unique ou du régime des rentes viagères pour les produits ou rentes.","auteur":"Mme Pirès Beaune (Socialistes et apparentés)","sort":"Retiré","lien":"https://www.assemblee-nationale.fr/dyn/17/amendements/AMANR5L17PO838901B1906P1D1N003210"},{"numero":"I-3249","texte_plf":"APRÈS ART. 3","article":"CGI art. 885 AA ; CGI/LPF art. 6, 669, 767, 1094‑1, 751, 792‑0 bis, 795, 795‑0 A, 754 B, 726, 1A, 964, 1380, 1407, 235 ter, L. 136‑1, 223 sexies, 204, 4 B, 164 D, 1716 bis, 1723 ter, 1715, 1717, L. 269","resume":"Il insère un chapitre Ier ter au titre IV du livre Ier du CGI et crée les articles 885 AA à 885 AG relatif à un « impôt plancher sur la fortune ». L'impôt s'applique lorsque la valeur des actifs visés excède 100 000 000 €, prévoit un régime d'assujettissement apprécié au 1er janvier, une assiette nette au 1er janvier, des règles d'intégration des primes d'assurance et des biens en fiducie ou trust, et institue une taxe due lors du transfert de domicile pour les contribuables domiciliés en France au moins six des dix années précédant le transfert, au tarif égal à dix fois celui prévu à l'article 885 AL avec possibilité d'échéonnement jusqu'à dix ans. L'exposé des motifs présente cette taxe comme un prélèvement plancher de 2 % destiné à atteindre une plus grande contribution des très hauts patrimoines. (identique à l’amendement I-2359)","auteur":"M. Sansu (Gauche Démocrate et Républicaine)","sort":"Rejeté","lien":"https://www.assemblee-nationale.fr/dyn/17/amendements/AMANR5L17PO838901B1906P1D1N003249"},{"numero":"I-3255","texte_plf":"APRÈS ART. 3","article":"CGI art. 91, 154 bis","resume":"Il rétablit l'article 91 du CGI et précise sa date d'entrée en vigueur. L'article soumet à l'impôt sur le revenu les sommes perçues par les ayants droit d'un titulaire de plan d'épargne retraite décédé après l'échéance au titre des versements déduits, accorde un abattement équivalent pour le calcul des droits de mutation, et dispose que l'entrée en vigueur intervient le 1er janvier 2026. L'exposé des motifs indique que la mesure vise à récupérer l'avantage fiscal lié à la déduction des versements PER en cas de décès du souscripteur.","auteur":"M. Sansu (Gauche Démocrate et Républicaine)","sort":"Rejeté","lien":"https://www.assemblee-nationale.fr/dyn/17/amendements/AMANR5L17PO838901B1906P1D1N003255"},{"numero":"I-3335","texte_plf":"ART. 3","article":"CGI art. 758, 758 bis","resume":"Insère l’article 758 bis dans le CGI concernant l’évaluation des titres transmis à titre gratuit par décès. La valeur imposable des titres transmis est fixée à la part de la valeur vénale nette des actifs non affectés à une activité opérationnelle correspondant aux droits financiers transmis, déduction faite des dettes, avec des décotes de minorité et d’illiquidité plafonnées ensemble à 10 %, neutralisation des apports réalisés dans l’année précédant le décès et interdiction d’une valeur imposable inférieure à celle résultant de l’article 758 ; le dispositif s’applique aux successions ouvertes à compter du 1er janvier 2026. L’exposé indique que la rédaction vise à sécuriser les transmissions de holdings patrimoniales en encadrant leur évaluation et en circonscrivant le champ aux holdings patrimoniales répondant aux critères prévus.","auteur":"M. Berger (Droite Républicaine)","sort":"Rejeté","lien":"https://www.assemblee-nationale.fr/dyn/17/amendements/AMANR5L17PO838901B1906P1D1N003335"},{"numero":"I-3377 (Rect)","texte_plf":"APRÈS ART. 3","article":"CGI art. 150 VC, 150 U, 200 B, 200 A, 257","resume":"Modifie l’article 150 VC et adapte la référence du premier alinéa de l’article 200 B. Remplace les cinq premiers alinéas du I de l’article 150 VC par un texte prévoyant que la plus-value brute est réduite d’un abattement correspondant à l’actualisation du prix d’acquisition selon le dernier indice des prix à la consommation hors tabac, que la durée de détention est décomptée et qu’un reversement de 10 % des recettes de l’impôt sur la plus-value immobilière est effectué aux collectivités territoriales ; précise la référence du taux au 1° du B du 1 de l’article 200 A. La réforme s’applique aux cessions de terrains à bâtir définis au 1° du 2 de l’article 257 à compter du 1er janvier 2027 et aux autres cessions visées aux articles 150 U, 150 UB et 150 UC à compter du 1er janvier 2028.","auteur":"M. Mattei (Les Démocrates)","sort":"Retiré","lien":"https://www.assemblee-nationale.fr/dyn/17/amendements/AMANR5L17PO838901B1906P1D1N003377"},{"numero":"I-3378","texte_plf":"APRÈS ART. 3","article":"CGI art. 14 bis, 31, 2, 200 A, 964","resume":"Il crée un article 14 bis au CGI, insère un 1° bis dans le A du 1 de l'article 200 A et modifie le régime applicable à l'assiette de l'impôt sur la fortune immobilière visé à l'article 964. Sur option expresse du contribuable, les revenus fonciers tirés de la location à bail d'un logement à usage d'habitation à des personnes sans lien de parenté, sous réserve que le loyer respecte les plafonds et conditions prévus (loyer fixé en application du o du 1° du I de l'article 31, plafonds de l'annexe 3, catégorie énergétique A à D et bail d'au moins douze mois), sont imposés selon le régime de l'article 200 A et ces logements sont exclus de l'assiette de l'IFI pendant toute la période de location. L'exposé des motifs indique que la mesure vise à créer un statut de l'investisseur immobilier attractif en contrepartie d'engagements de loyers encadrés et de performance énergétique.","auteur":"M. Mattei (Les Démocrates)","sort":"Rejeté","lien":"https://www.assemblee-nationale.fr/dyn/17/amendements/AMANR5L17PO838901B1906P1D1N003378"},{"numero":"I-3379","texte_plf":"APRÈS ART. 3","article":"CGI art. 964, 965, 975, 31, 2, 977","resume":"Modifie les articles 964, 965, 975 et 977 du CGI pour transformer l’impôt sur la fortune immobilière en un impôt sur la fortune improductive. Le dispositif remplace la notion « immobiliers/immobilière » par « improductifs/improductive », relève le seuil d’entrée à 2 000 000 € au lieu de 1 300 000 €, intègre dans l’assiette les sommes, rentes et valeurs d’assurance‑vie hors unités de compte ainsi que liquidités et placements financiers, les actifs numériques et les biens meubles corporels, prévoit des exonérations pour les logements loués à bail d’au‑moins douze mois sous conditions de loyer et de performance énergétique (A à D) et fixe un taux unique de 1 % sur la fraction du patrimoine net taxable excédant 2 000 000 €. L’exposé précise que la réforme vise à encourager l’investissement productif et à cibler les patrimoines les plus élevés.","auteur":"M. Mattei (Les Démocrates)","sort":"Adopté","lien":"https://www.assemblee-nationale.fr/dyn/17/amendements/AMANR5L17PO838901B1906P1D1N003379"},{"numero":"I-3386","texte_plf":"APRÈS ART. 10","article":"CGI art. 244 quater Z, 151 septies","resume":"Crée l’article 244 quater Z du CGI et modifie l’article 151 septies du même code. Le nouvel article instaure un crédit d’impôt annuel égal à 7,5 % des dépenses de mécanisation collective facturées par la coopérative au titre de l’année, sous réserve d’un montant minimal de crédit de 500 €, d’un plafond de 3 000 € par exploitant et par année civile (sans plafond pour les exploitants en activité depuis moins de trois ans) et d’application aux dépenses facturées à compter du 1er janvier 2026 ; l’article 151 septies est complété par un c) bis fixant à 330 000 € un seuil pour certaines plus‑values de matériels agricoles et précise une fourchette de recettes supérieure à 300 000 € et inférieure à 350 000 € pour l’application de cette disposition. L’exposé des motifs indique que la mesure vise à encourager la mutualisation des matériels agricoles et à rééquilibrer la fiscalité de la mécanisation.","auteur":"M. Lecamp (Les Démocrates)","sort":"Retiré","lien":"https://www.assemblee-nationale.fr/dyn/17/amendements/AMANR5L17PO838901B1906P1D1N003386"},{"numero":"I-3476","texte_plf":"ART. 3","article":"CGI art. 223 VJ bis","resume":"Crée l’article 223 VJ bis du CGI instituant une taxe sur les bénéfices non distribués. La taxe est due à un taux de 20 % sur les bénéfices accumulés non distribués, avec une détermination distincte pour les entreprises dont plus de 60 % des produits sont des revenus dits passifs et des règles de calcul spécifiques selon deux catégories d’entreprises, ainsi que des seuils de 50 000 € et 250 000 € selon le cas. L’exposé vise à taxer les profits qui échappent à l’impôt sur le revenu via la thésaurisation et les holdings.","auteur":"Mme Pirès Beaune (Socialistes et apparentés)","sort":"Rejeté","lien":"https://www.assemblee-nationale.fr/dyn/17/amendements/AMANR5L17PO838901B1906P1D1N003476"},{"numero
