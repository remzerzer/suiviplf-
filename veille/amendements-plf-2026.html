":"I-3480","texte_plf":"APRÈS ART. 3","article":"CGI art. 983 A, 983 B, 1A, 964, 1380, 1393, 1407, 235 ter, L. 136‑1, 15, 223 sexies, 983 C, 757 B, 792‑0 bis, 795, 795‑0 A, 754 B, 726, L. 212‑1, 44 sexies","resume":"Insère un chapitre II ter et crée les articles 983 A à 983 C du CGI instituant un impôt minimum sur les très hauts patrimoines. La contribution s’applique aux foyers dont le patrimoine net global excède 10 millions d’euros et est égale à la différence, si positive, entre 3 % du patrimoine financier net global et la somme des impôts et contributions acquittés, avec des règles d’assiette calquées sur les droits de mutation par décès et des exonérations ciblées pour biens professionnels familiaux ou innovants; les contribuables domiciliés en France au moins six des dix années précédant un transfert hors de France sont imposables lors de ce transfert à un tarif égal à dix fois celui prévu au II, avec possibilité d’échelonnement jusqu’à dix ans. L’exposé des motifs précise que l’objectif est de garantir une contribution effective et équitable des patrimoines les plus élevés.","auteur":"Mme Mercier (Socialistes et apparentés)","sort":"Rejeté","lien":"https://www.assemblee-nationale.fr/dyn/17/amendements/AMANR5L17PO838901B1906P1D1N003480"},{"numero":"I-3587","texte_plf":"APRÈS ART. 3","article":"CGI art. 117 quater, 125‑0 A, 125 A, 163 quinquies C, 167 bis, 187, 200 A, 244 bis B","resume":"Modifie un ensemble d’articles du CGI (dont 117 quater, 125‑0 A, 125 A, 163 quinquies C, 167 bis, 187, 200 A et 244 bis B) pour introduire une progressivité limitée du taux d’impôt sur le revenu applicable aux revenus du capital. Le dispositif instaure trois tranches du taux d’impôt (part IR) applicables aux revenus du capital : 7,8 % pour la fraction n’excédant pas 100 000 euros, 12,8 % pour la fraction comprise entre 100 000 euros et 300 000 euros, et 17,8 % pour la fraction excédant 300 000 euros, les modifications étant reportées dans les articles listés. L’exposé des motifs indique que l’objectif est de renforcer la progressivité de la fiscalité du capital tout en préservant la simplicité du prélèvement forfaitaire unique et sans modifier les prélèvements sociaux.","auteur":"M. Ceccoli (Droite Républicaine)","sort":"Rejeté","lien":"https://www.assemblee-nationale.fr/dyn/17/amendements/AMANR5L17PO838901B1906P1D1N003587"},{"numero":"I-3709","texte_plf":"ART. 5","article":"CGI art. 199, 73 B","resume":"Modifie l’article 199 vicies A du CGI en transformant la réduction d’impôt applicable au dispositif en un crédit d’impôt et en adaptant ses conditions d’application. Le crédit s’applique aux ventes sans différé (contrat authentique, évaluation par un organisme comptable, paiement en numéraire, société gérée majoritairement par des associés exploitants), la cession devant intervenir entre le 1er janvier 2026 et le 31 décembre 2035, et il est fixé à 50 % avec des formules et plafonds annuels prévus : 50 % des intérêts perçus dans la limite de 15 000 € pour les célibataires et 20 000 € pour les mariés, et 50 % du prix de vente dans la limite de 20 000 € pour les célibataires et 25 000 € pour les mariés. L’exposé des motifs indique que l’objectif est de favoriser la transmission d’exploitations agricoles à des jeunes et de moderniser un dispositif peu utilisé.","auteur":"M. Naegelen (LIOT)","sort":"Retiré","lien":"https://www.assemblee-nationale.fr/dyn/17/amendements/AMANR5L17PO838901B1906P1D1N003709"},{"numero":"I-3718","texte_plf":"APRÈS ART. 3","article":"CGI art. 150","resume":"Modifie des dispositions du CGI relatives aux régimes dérogatoires prévus aux articles de la série 150. Supprime la seconde phrase du 1° du II de l’article 150 UA, abroge le 5° de l’article 150 VJ et remplace le taux « 6 % » par « 11 % » au 2° du II de l’article 150 VK. L’exposé des motifs indique que l’objectif est de supprimer le taux réduit de TVA de 5,5 % applicable à la vente d’œuvres d’art.","auteur":"Mme Perrine Goulet (Les Démocrates)","sort":"Non soutenu","lien":"https://www.assemblee-nationale.fr/dyn/17/amendements/AMANR5L17PO838901B1906P1D1N003718"},{"numero":"I-3823","texte_plf":"APRÈS ART. 3","article":"CGI art. 885 AA","resume":"Modifie l’article 885 AA du CGI. Il substitue la date « 1er janvier 2026 » par la date « 1er janvier 2056 » au dernier alinéa. L’exposé des motifs indique que ce décalage vise à marquer son opposition à la mesure visée.","auteur":"M. Sitzenstuhl (Ensemble pour la République)","sort":"Retiré","lien":"https://www.assemblee-nationale.fr/dyn/17/amendements/AMANR5L17PO838901B1906P1D1N003823"},{"numero":"I-3877","texte_plf":"APRÈS ART. 3","article":"CGI art. 167 bis","resume":"Dispositif non exploitable (identique à l’amendement I-996)","auteur":"M. Mattei et M. Mandon (Les Démocrates)","sort":"Irrecevable","lien":"https://www.assemblee-nationale.fr/dyn/17/amendements/AMANR5L17PO838901B1906P1D1N003877"},{"numero":"I-3878","texte_plf":"APRÈS ART. 3","article":"CGI art. 885 AA","resume":"Modifie l’article 885 AA du CGI. À l’alinéa 35, il remplace le taux « 2 » par le taux « 1,8 % ». L’exposé des motifs indique que la justification de l’amendement ressort de son dispositif.","auteur":"M. Maurel (Gauche Démocrate et Républicaine)","sort":"Retiré","lien":"https://www.assemblee-nationale.fr/dyn/17/amendements/AMANR5L17PO838901B1906P1D1N003878"},{"numero":"I-3880","texte_plf":"APRÈS ART. 3","article":"CGI art. 885 AA","resume":"Modifie l’article 885 AA du CGI en substituant un nouveau taux. Le taux prévu à l’alinéa 35 est remplacé de « 2 % » par « 1,9 % ». L’exposé indique que l’amendement se justifie par son dispositif.","auteur":"M. Peu (Gauche Démocrate et Républicaine)","sort":"Retiré","lien":"https://www.assemblee-nationale.fr/dyn/17/amendements/AMANR5L17PO838901B1906P1D1N003880"},{"numero":"I-3882","texte_plf":"APRÈS ART. 12","article":"CGI art. 31","resume":"Modifie l’article 31 du CGI en relevant un taux prévu au texte. Remplace le taux « 2 % » par le taux « 3 % » à l’alinéa 3 et, en conséquence, opère la même substitution au second emplacement visé à l’alinéa 17. L’exposé des motifs indique que la modification rapproche la proposition des recommandations d’un rapport sénatorial liées à la rentabilité de l’investissement locatif.","auteur":"M. Bruneau et M. Bataille (LIOT)","sort":"Retiré","lien":"https://www.assemblee-nationale.fr/dyn/17/amendements/AMANR5L17PO838901B1906P1D1N003882"},{"numero":"I-3885","texte_plf":"APRÈS ART. 12","article":"CGI art. 31","resume":"Modifie l’article 31 du CGI en relevant des taux et en majorant des plafonds. Substitue le taux « 2 % » par « 3 % » à la première phrase de l’alinéa 3 et à l’alinéa 17, et remplace le montant « 5 000 € » par « 8 000 € » à l’alinéa 11 et à l’alinéa 18. L’exposé des motifs indique que ces ajustements visent à rapprocher le dispositif des recommandations visant à garantir une rentabilité minimale de l’investissement immobilier.","auteur":"M. Bruneau et M. Bataille (LIOT)","sort":"Retiré","lien":"https://www.assemblee-nationale.fr/dyn/17/amendements/AMANR5L17PO838901B1906P1D1N003885"},{"numero":"I-3901","texte_plf":"ART. 3","article":"CIBS art. L. 421‑2, 238 bis","resume":"Modifie le texte visé en substituant les alinéas 16 à 19 par cinq nouveaux alinéas. Le nouveau dispositif énumère comme biens visés les véhicules de tourisme non affectés à une activité professionnelle au sens de l’article L. 421‑2 du code des impositions sur les biens et services, les yachts, bateaux de plaisance et aéronefs, les bijoux, métaux précieux et objets d’art, de collection ou d’antiquité (à l’exclusion de ceux bénéficiant du régime prévu par l’article 238 bis AB), les chevaux de course ou de concours, les vins et alcools, et les logements et résidences mis à disposition, même partiellement, de la personne physique visée. L’exposé des motifs indique que la mesure a pour objet d’élargir le périmètre des biens somptuaires aux biens les plus communément admis comme tels.","auteur":"M. Ray et M. Berger (Droite Républicaine)","sort":"Adopté","lien":"https://www.assemblee-nationale.fr/dyn/17/amendements/AMANR5L17PO838901B1906P1D1N003901"},{"numero":"II-CF215","texte_plf":"APRÈS ART. 77","article":"CGI art. 1595 bis, 1648 A","resume":"Il modifie les articles 1595 bis et 1648 A du CGI. Il ajoute, dans chacun de ces articles, la précision selon laquelle les modalités de répartition adoptées pour les communes nouvelles doivent tenir compte du nombre de leurs communes fondatrices. L'exposé des motifs indique que cette disposition vise à éviter que les communes nouvelles ne soient injustement pénalisées dans la répartition des fonds départementaux de péréquation.","auteur":"M. Castellani (LIOT)","sort":"Non soutenu","lien":"https://www.assemblee-nationale.fr/dyn/17/amendements/AMANR5L17PO59048B1906P2D1N000215"},{"numero":"II-CF630","texte_plf":"APRÈS ART. 77","article":"CGI art. 1609 quinquies C, 1519 D, 1609 nonies C","resume":"Il modifie les articles 1609 quinquies C et 1609 nonies C du CGI et insère des possibilités relatives aux articles 1519 D et 1519 F. Il prévoit que, sur délibération de l'organe délibérant de l'EPCI à fiscalité propre, une fraction du produit visé à l'article 1519 D (et, pour le 1 quater, des produits visés aux articles 1519 D et 1519 F) peut être versée aux communes membres de cet établissement public. L'exposé des motifs indique que la mesure vise à offrir un mécanisme plus simple et plus souple de redistribution des recettes IFER afin de favoriser l'acceptabilité et le déploiement des projets d'énergies renouvelables locaux.","auteur":"M. Ray (Droite Républicaine)","sort":"Adopté","lien":"https://www.assemblee-nationale.fr/dyn/17/amendements/AMANR5L17PO59048B1906P2D1N000630"}]</script>
<script>
(function(){
var lignes=JSON.parse(document.getElementById('donnees').textContent);
var corps=document.getElementById('corps'),vide=document.getElementById('vide'),compte=document.getElementById('compte');
var q=document.getElementById('q'),fsort=document.getElementById('fsort'),fart=document.getElementById('fart');
function options(select,valeurs){valeurs.forEach(function(v){var o=document.createElement('option');o.value=v;o.textContent=v;select.appendChild(o);});}
options(fsort,Array.from(new Set(lignes.map(function(l){return l.sort;}).filter(Boolean))).sort());
options(fart,Array.from(new Set(lignes.map(function(l){return l.texte_plf;}).filter(Boolean))).sort(function(a,b){return a.localeCompare(b,'fr',{numeric:true});}));
function classe(s){s=(s||'').toLowerCase();if(s.indexOf('adopt')===0)return 'adopte';if(s.indexOf('rejet')===0)return 'rejete';return 'autre';}
function ech(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/'/g,'&#39;');}
function rendre(){
var texte=q.value.trim().toLowerCase(),s=fsort.value,a=fart.value,html='',n=0;
lignes.forEach(function(l){
if(s&&l.sort!==s)return;if(a&&l.texte_plf!==a)return;
if(texte&&(l.numero+' '+l.article+' '+l.resume+' '+l.auteur).toLowerCase().indexOf(texte)===-1)return;
n++;
html+='<tr><td class='num'><a href=''+ech(l.lien)+'' target='_blank' rel='noopener'>'+ech(l.numero)+'</a></td><td>'+ech(l.texte_plf)+'</td><td class='art'>'+ech(l.article)+'</td><td>'+ech(l.resume)+'</td><td>'+ech(l.auteur)+'</td><td class='sort '+classe(l.sort)+''>'+ech(l.sort)+'</td></tr>';
});
corps.innerHTML=html;vide.hidden=n>0;compte.textContent=n+' amendement(s) affiché(s) sur '+lignes.length;
}
q.addEventListener('input',rendre);fsort.addEventListener('change',rendre);fart.addEventListener('change',rendre);
rendre();
})();
</script>
</body>
</html>
