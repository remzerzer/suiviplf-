<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PLF 2026 — rejeu de la procédure</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,300..600&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --fond:#EDF0F5;--surface:#FFFFFF;--encre:#0F151E;--graphite:#3F4550;--gris:#68717E;
  --trait:#C9D1DC;--bleu:#22368C;--bleu-pale:#E6EAF6;--rouge:#A3282B;--rouge-pale:#F7E9E9;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--fond);color:var(--encre);
  font-family:"Newsreader",Georgia,"Times New Roman",serif;font-size:16.5px;line-height:1.6}
.page{max-width:1000px;margin:0 auto;padding:0 20px 96px}

.barre{background:var(--encre);color:#fff;margin:0 -20px;padding:14px 20px;
  display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px}
.barre .tag{font-family:"DM Mono",ui-monospace,monospace;font-size:10.5px;letter-spacing:.14em;
  text-transform:uppercase;border:1px solid rgba(255,255,255,.4);padding:3px 8px;flex:0 0 auto}
.barre .curseur{flex:1 1 260px;display:flex;align-items:center;gap:12px;min-width:200px}
.barre input[type=range]{flex:1;accent-color:#fff;min-width:120px}
.barre .jour{font-family:"DM Mono",ui-monospace,monospace;font-size:13px;white-space:nowrap}
.barre button{font-family:"Newsreader",Georgia,serif;font-size:13px;background:#1B2330;color:#fff;
  border:1px solid #39414F;padding:7px 14px;cursor:pointer}
.barre button:hover{background:#28313F}
.barre button:focus-visible,.barre input:focus-visible{outline:2px solid #fff;outline-offset:2px}

.statut{padding:52px 0 34px;border-bottom:1px solid var(--trait);text-align:center}
.titre-page{font-family:"Newsreader",Georgia,serif;font-weight:600;
  font-size:clamp(30px,4.6vw,46px);line-height:1.06;letter-spacing:-.015em;margin:0 0 14px}
.fil{font-family:"DM Mono",ui-monospace,monospace;font-size:11px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--gris);margin:0 0 30px}
.phrase{font-family:"Newsreader",Georgia,serif;
  font-weight:400;font-size:clamp(24px,3.6vw,36px);line-height:1.16;letter-spacing:-.008em;
  margin:0 auto;max-width:22ch;color:var(--graphite)}
.phrase .l{display:block}
.phrase .l.an{color:var(--bleu)}
.phrase .l.senat{color:var(--rouge)}

.couloirs{display:flex;justify-content:space-between;align-items:center;margin:46px 0 8px}
.couloir{font-family:"Newsreader",Georgia,serif;font-weight:600;
  font-size:12px;letter-spacing:.18em;text-transform:uppercase}
.couloir.gauche{color:var(--bleu)}
.couloir.droite{color:var(--rouge)}
.couloir.milieu{color:var(--gris);font-size:10px;letter-spacing:.1em}

.navette{list-style:none;margin:0;padding:0;position:relative}
.navette::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;
  background:var(--trait);transform:translateX(-.5px)}
.jalon{position:relative;display:grid;grid-template-columns:1fr 60px 1fr;margin-bottom:12px}
.carte{grid-column:1;padding-right:34px;text-align:right}
.jalon[data-cote="droite"] .carte{grid-column:3;padding:0 0 0 34px;text-align:left}
.jalon[data-cote="centre"] .carte{grid-column:1/-1;padding:0;text-align:center;max-width:470px;margin:0 auto}
.jalon[data-etat="venir"]{opacity:.42}

.puce{grid-column:2;justify-self:center;align-self:start;margin-top:15px;width:12px;height:12px;
  border-radius:50%;background:var(--fond);border:2px solid var(--trait);position:relative;z-index:2}
.jalon[data-etat="fait"] .puce{background:var(--graphite);border-color:var(--graphite)}
.jalon[data-chambre="an"][data-etat="fait"] .puce{background:var(--bleu);border-color:var(--bleu)}
.jalon[data-chambre="senat"][data-etat="fait"] .puce{background:var(--rouge);border-color:var(--rouge)}
.jalon[data-etat="cours"] .puce{background:#fff;border-width:4px;border-color:var(--graphite);
  width:18px;height:18px;margin-top:12px}
.jalon[data-chambre="an"][data-etat="cours"] .puce{border-color:var(--bleu)}
.jalon[data-chambre="senat"][data-etat="cours"] .puce{border-color:var(--rouge)}
.jalon[data-etat="cours"] .puce::after{content:"";position:absolute;inset:-9px;border-radius:50%;
  border:1px solid currentColor;opacity:.5;animation:halo 2.4s ease-out infinite}
.jalon[data-chambre="an"][data-etat="cours"] .puce::after{color:var(--bleu)}
.jalon[data-chambre="senat"][data-etat="cours"] .puce::after{color:var(--rouge)}
@keyframes halo{0%{transform:scale(.7);opacity:.6}100%{transform:scale(1.5);opacity:0}}

.tete{background:var(--surface);border:1px solid var(--trait);width:100%;text-align:inherit;
  padding:13px 15px;cursor:pointer;font-family:inherit;color:inherit;transition:border-color .15s}
.tete:hover{border-color:var(--graphite)}
.tete:focus-visible{outline:2px solid var(--encre);outline-offset:2px}
.jalon[data-etat="cours"] .tete{box-shadow:0 2px 0 0 var(--graphite);border-color:var(--graphite)}
.jalon[data-chambre="an"][data-etat="cours"] .tete{box-shadow:0 2px 0 0 var(--bleu);border-color:var(--bleu)}
.jalon[data-chambre="senat"][data-etat="cours"] .tete{box-shadow:0 2px 0 0 var(--rouge);border-color:var(--rouge)}
.jalon[data-etat="venir"] .tete{background:transparent;border-style:dashed}

.quand{font-family:"DM Mono",ui-monospace,monospace;font-size:11px;letter-spacing:.06em;
  color:var(--gris);display:block;margin-bottom:5px}
.jalon[data-chambre="an"] .quand{color:var(--bleu)}
.jalon[data-chambre="senat"] .quand{color:var(--rouge)}
.nom{font-family:"Newsreader",Georgia,serif;font-weight:600;
  font-size:18.5px;line-height:1.28;margin:0}
.doc{font-family:"DM Mono",ui-monospace,monospace;font-size:12px;color:var(--graphite);margin:6px 0 0}

.fiche{margin-top:9px;background:var(--surface);border:1px solid var(--trait);
  border-left:3px solid var(--graphite);padding:15px 17px;text-align:left;font-size:14.5px}
.jalon[data-chambre="an"] .fiche{border-left-color:var(--bleu)}
.jalon[data-chambre="senat"] .fiche{border-left-color:var(--rouge)}
.fiche p{margin:0 0 11px}
.fiche p:last-child{margin-bottom:0}
.cle{font-family:"DM Mono",ui-monospace,monospace;font-size:10px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--gris);display:block;margin-bottom:2px}
.fiche a{color:var(--bleu);text-underline-offset:2px;word-break:break-word}


@media (max-width:720px){
  .couloirs{display:none}
  .navette::before{left:6px}
  .jalon{grid-template-columns:26px 1fr}
  .carte,.jalon[data-cote="droite"] .carte,.jalon[data-cote="centre"] .carte{
    grid-column:2;padding:0;text-align:left;max-width:none;margin:0}
  .puce{grid-column:1;grid-row:1;justify-self:start}
  .jalon[data-etat="cours"] .puce{margin-left:-3px}
  .phrase{max-width:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="page">

<div class="barre">
  <span class="tag">Rejeu des données réelles</span>
  <div class="curseur">
    <label for="curseur" class="jour" id="etiquette">14 octobre 2025</label>
    <input type="range" id="curseur" min="0" max="129" value="64" aria-label="Se placer à une date">
  </div>
  <button type="button" id="rejouer">Rejouer la procédure</button>
</div>

<section class="statut">
  <h1 class="titre-page">Suivi du Projet de loi de finance pour 2026 essai 2 </h1>
  <p class="fil">Phase parlementaire · rejeu des données officielles</p>
  <p class="phrase" id="phrase"></p>
</section>

<div class="couloirs">
  <span class="couloir gauche">Assemblée nationale</span>
  <span class="couloir milieu"></span>
  <span class="couloir droite">Sénat</span>
</div>

<ol class="navette" id="navette"></ol>

</div>

<script>
(function(){
  "use strict";

  var DEPOT = new Date(2025,9,14);
  var MAX = 129;

  var E = [
    {d:"2025-10-14",ch:"an",co:"centre",nom:"Dépôt à l'Assemblée nationale",
     doc:"Texte n° 1906",nature:"Ouverture de la procédure",
     txt:"Le texte a été déposé à l'Assemblée nationale par Roland Lescure et Amélie de Montchalin, après avoir été présenté en Conseil des ministres le matin même. Il est aussitôt renvoyé à la commission des finances, qui est seule compétente au fond sur un projet de loi de finances.",
     lien:"https://www.assemblee-nationale.fr/dyn/17/textes/l17b1906_projet-loi",
     ph:"vient d'être déposé à l'Assemblée"},

    {d:"2025-10-23",ch:"an",co:"gauche",nom:"Rapport de la commission des finances",
     doc:"Rapport n° 1996, quatre tomes",nature:"Travaux de commission",
     txt:"La commission des finances a examiné le texte et publié son rapport général, rédigé par Philippe Juvin. Sept autres commissions, saisies pour avis sur les crédits qui les concernent, ont rendu leurs travaux entre le 22 octobre et le 6 novembre.",
     lien:"https://www.assemblee-nationale.fr/dyn/17/rapports/cion_fin/l17b1996-ti_rapport-fond",
     ph:"est en commission des finances"},

    {d:"2025-11-21",ch:"an",co:"gauche",nom:"Texte rejeté par l'Assemblée",
     doc:"Texte n° 180",nature:"Séance publique",
     txt:"L'Assemblée nationale a rejeté le texte en première lecture, trente-huit jours après son dépôt. Ce rejet ne met pas fin à la procédure : le Gouvernement saisit le Sénat et la navette se poursuit normalement.",
     lien:"https://www.assemblee-nationale.fr/dyn/17/textes/l17t0180_texte-adopte-seance",
     ph:"a été rejeté par l'Assemblée"},

    {d:"2025-11-24",ch:"senat",co:"droite",nom:"Transmission au Sénat",
     doc:"Texte n° 138 (2025-2026)",nature:"Saisine du Sénat",
     txt:"Le Gouvernement a transmis le texte au Sénat, qui devient à son tour compétent pour l'examiner. Sa commission des finances a désigné Jean-François Husson comme rapporteur général.",
     lien:"https://www.senat.fr/leg/pjl25-138.html",
     ph:"est transmis au Sénat"},

    {d:"2025-11-27",ch:"senat",co:"droite",nom:"Séance publique au Sénat",
     doc:"Dix-sept jours de séance",nature:"Séance publique",
     txt:"Le Sénat a examiné le texte en séance publique pendant dix-sept jours, du 27 novembre au 15 décembre 2025. C'est au cours de ces séances que les amendements sénatoriaux sont discutés et votés.",
     lien:"https://www.senat.fr/amendements/2025-2026/138/accueil.html",
     ph:"est en séance au Sénat"},

    {d:"2025-12-15",ch:"senat",co:"droite",nom:"Texte adopté par le Sénat",
     doc:"Texte n° 29 (2025-2026)",nature:"Séance publique",
     txt:"Le Sénat a adopté sa propre version du texte, vingt et un jours après avoir été saisi. Cette version diffère sensiblement de celle que l'Assemblée avait rejetée, ce qui rend un désaccord entre les deux chambres inévitable.",
     lien:"https://www.senat.fr/leg/tas25-029.html",
     ph:"est adopté par le Sénat"},

    {d:"2025-12-19",ch:"an",co:"centre",nom:"Commission mixte paritaire : désaccord",
     doc:"Rapport n° 245 au Sénat, n° 2266 à l'Assemblée",nature:"Conciliation",
     txt:"La commission mixte paritaire, composée de sept députés et sept sénateurs, n'est pas parvenue à s'accorder sur un texte commun. Le texte doit donc repartir en nouvelle lecture devant chaque chambre avant que le Gouvernement puisse demander à l'Assemblée de statuer définitivement.",
     lien:"https://www.senat.fr/rap/l25-245/l25-245.html",
     ph:"est en commission mixte paritaire"},

    {d:"2025-12-26",ch:"an",co:"centre",nom:"Loi spéciale promulguée",
     doc:"Loi n° 2025-1316 du 26 décembre 2025",nature:"secours",
     txt:"Faute de budget voté avant la fin de l'année, le Parlement a adopté une loi spéciale qui autorise l'État à continuer de percevoir les impôts existants jusqu'à l'entrée en vigueur de la loi de finances. Elle évalue également à 45,2 milliards d'euros les prélèvements sur recettes au profit des collectivités territoriales.",
     lien:"https://www.legifrance.gouv.fr/jorf/id/JORFTEXT000053173986",
     ph:"attend, sous le régime de la loi spéciale"},

    {d:"2025-12-31",ch:"an",co:"gauche",nom:"Nouvelle lecture, saisine de l'Assemblée",
     doc:"Texte n° 2247",nature:"Saisine",
     txt:"L'Assemblée nationale a été saisie du texte tel que le Sénat l'avait modifié, pour une nouvelle lecture. L'exercice budgétaire 2026 s'ouvre donc sans loi de finances, sous le seul régime de la loi spéciale.",
     lien:"https://www.assemblee-nationale.fr/dyn/17/textes/l17b2247_projet-loi",
     ph:"revient à l'Assemblée en nouvelle lecture"},

    {d:"2026-01-10",ch:"an",co:"gauche",nom:"Commission des finances, nouvelle lecture",
     doc:"Rapport n° 2321, deux volumes",nature:"Travaux de commission",
     txt:"La commission des finances a réexaminé le texte au cours de trois réunions, du 8 au 10 janvier 2026. Les députés peuvent y déposer de nouveaux amendements, sauf sur les articles que les deux chambres ont déjà votés dans les mêmes termes, qui ne sont plus discutables.",
     lien:"https://www.assemblee-nationale.fr/dyn/17/rapports/cion_fin/l17b2321-v1_rapport-fond",
     ph:"est en commission, en nouvelle lecture"},

    {d:"2026-01-27",ch:"an",co:"gauche",nom:"Adoption par engagement de responsabilité",
     doc:"Texte n° 218",nature:"censure",
     txt:"Le Gouvernement a engagé sa responsabilité sur le vote du texte. Aucune motion de censure n'ayant été adoptée, le texte est réputé adopté par l'Assemblée sans qu'un vote intervienne sur son contenu.",
     lien:"https://www.assemblee-nationale.fr/dyn/17/textes/l17t0218_texte-adopte-seance",
     ph:"est adopté à l'Assemblée par 49.3"},

    {d:"2026-01-27",ch:"senat",co:"droite",nom:"Nouvelle lecture, saisine du Sénat",
     doc:"Texte n° 308 (2025-2026)",nature:"Saisine",
     txt:"Le texte est retourné au Sénat pour une nouvelle lecture, étape que la Constitution impose avant toute lecture définitive à l'Assemblée. Jean-François Husson a déposé son rapport dès le lendemain.",
     lien:"https://www.senat.fr/leg/pjl25-308.html",
     ph:"repart au Sénat en nouvelle lecture"},

    {d:"2026-01-29",ch:"senat",co:"droite",nom:"Question préalable adoptée",
     doc:"Texte n° 48 (2025-2026)",nature:"Séance publique",
     txt:"Le Sénat a adopté par 203 voix contre 32 une question préalable, procédure par laquelle il rejette le texte sans en discuter le contenu. Aucun amendement sénatorial n'a donc été adopté à ce stade, alors que ce sont les seuls que l'Assemblée pourra reprendre en lecture définitive.",
     lien:"https://www.senat.fr/leg/tas25-048.html",
     ph:"est rejeté par le Sénat"},

    {d:"2026-01-30",ch:"an",co:"gauche",nom:"Lecture définitive et motion de censure",
     doc:"Rapport n° 2412",nature:"censure",
     txt:"La commission des finances s'est réunie le matin, puis le Gouvernement a de nouveau engagé sa responsabilité sur le texte. Cent treize députés ont déposé une motion de censure le jour même, dans le délai de vingt-quatre heures prévu par la Constitution.",
     lien:"https://www.assemblee-nationale.fr/dyn/17/rapports/cion_fin/l17b2412_rapport-fond",
     ph:"est en lecture définitive"},

    {d:"2026-02-02",ch:"an",co:"gauche",nom:"Adoption définitive",
     doc:"Texte n° 227",nature:"censure",
     txt:"La motion de censure a été rejetée, ce qui rend le texte définitivement adopté par le Parlement. Cent onze jours se sont écoulés depuis le dépôt, pour un délai constitutionnel fixé à soixante-dix jours.",
     lien:"https://www.assemblee-nationale.fr/dyn/17/textes/l17t0227_texte-adopte-seance",
     ph:"est adopté définitivement"},

    {d:"2026-02-04",ch:"an",co:"centre",nom:"Saisine du Conseil constitutionnel",
     doc:"Saisine du Premier ministre et de soixante députés au moins",nature:"Contrôle",
     txt:"Le Premier ministre et au moins soixante députés ont saisi le Conseil constitutionnel avant la promulgation. Cette saisine suspend le délai de promulgation et ouvre au Conseil un délai d'un mois pour statuer, ramené à huit jours si le Gouvernement invoque l'urgence.",
     lien:"https://www.conseil-constitutionnel.fr/decision/2026/2026901DC.htm",
     ph:"est devant le Conseil constitutionnel"},

    {d:"2026-02-19",ch:"an",co:"centre",nom:"Décision du Conseil constitutionnel",
     doc:"Décision n° 2026-901 DC, partiellement conforme",nature:"Contrôle",
     txt:"Le Conseil constitutionnel a rendu sa décision quinze jours après avoir été saisi. Il déclare le texte partiellement conforme à la Constitution : certaines dispositions sont censurées et ne figureront donc pas dans la loi promulguée.",
     lien:"https://www.conseil-constitutionnel.fr/decision/2026/2026901DC.htm",
     ph:"a été examiné par le Conseil constitutionnel"},

    {d:"2026-02-19",ch:"an",co:"centre",nom:"Promulgation",
     doc:"Loi n° 2026-103 du 19 février 2026",nature:"Fin de la procédure",
     txt:"Le Président de la République a promulgué la loi le jour même de la décision du Conseil constitutionnel, et elle a été publiée au Journal officiel le lendemain. Cent vingt-huit jours se sont écoulés entre le dépôt du projet et son entrée en vigueur.",
     lien:"https://www.legifrance.gouv.fr/jorf/id/JORFTEXT000053508155",
     ph:"est promulgué"}
  ];

  function dt(s){var p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2]);}
  function ajout(d,n){var x=new Date(d.getTime());x.setDate(x.getDate()+n);return x;}
  function fr(d){return d.toLocaleDateString("fr-FR",{day:"numeric",month:"long",year:"numeric"});}
  function ecart(a,b){return Math.round((b-a)/86400000);}

  var elC=document.getElementById("curseur"),elE=document.getElementById("etiquette"),
      elP=document.getElementById("phrase"),elN=document.getElementById("navette"),
      elRj=document.getElementById("rejouer");

  var ouverts={},anim=null;

  function rendu(){
    var j=parseInt(elC.value,10), auj=ajout(DEPOT,j);
    elE.textContent=fr(auj);

    var dernier=-1;
    E.forEach(function(e,i){ if(dt(e.d)<=auj) dernier=i; });

    if(dernier<0){
      elP.innerHTML='<span class="l">Le PLF 2026</span><span class="l">n\'est pas encore déposé.</span>';
    }else{
      var e=E[dernier], cls=e.ch==="an"?"an":"senat";
      elP.innerHTML='<span class="l">Le texte</span><span class="l '+cls+'">'+e.ph+".</span>";
    }

    elN.innerHTML=E.map(function(e,i){
      var etat = i<dernier?"fait":(i===dernier?"cours":"venir");
      var o=!!ouverts[i];
      return '<li class="jalon" data-cote="'+e.co+'" data-chambre="'+e.ch+'" data-etat="'+etat+'">'+
        '<span class="puce" aria-hidden="true"></span>'+
        '<div class="carte">'+
          '<button class="tete" type="button" aria-expanded="'+o+'" data-i="'+i+'">'+
            '<span class="quand">'+fr(dt(e.d))+' · jour '+ecart(DEPOT,dt(e.d))+'</span>'+
            '<p class="nom">'+e.nom+'</p>'+
            '<p class="doc">'+e.doc+'</p>'+
          '</button>'+
          (o?'<div class="fiche">'+
            '<p>'+e.txt+'</p>'+
            '<p><span class="cle">Document officiel</span><a href="'+e.lien+'" target="_blank" rel="noopener">'+e.lien+'</a></p>'+
          '</div>':'')+
        '</div></li>';
    }).join("");

  }

  elC.addEventListener("input",rendu);
  elN.addEventListener("click",function(ev){
    var b=ev.target.closest(".tete");if(!b)return;
    var i=b.getAttribute("data-i");ouverts[i]=!ouverts[i];rendu();
  });
  elRj.addEventListener("click",function(){
    if(anim){clearInterval(anim);anim=null;elRj.textContent="Rejouer la procédure";return;}
    if(window.matchMedia("(prefers-reduced-motion: reduce)").matches){elC.value=MAX;rendu();return;}
    elC.value=0;rendu();elRj.textContent="Arrêter";
    anim=setInterval(function(){
      var v=parseInt(elC.value,10);
      if(v>=MAX){clearInterval(anim);anim=null;elRj.textContent="Rejouer la procédure";return;}
      elC.value=v+1;rendu();
    },95);
  });

  rendu();
})();
</script>
</body>
</html>
