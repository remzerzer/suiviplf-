<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PLF 2026 — rejeu de la procédure</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,300..600&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --fond:#EDF0F5;--surface:#FFFFFF;--encre:#0F151E;--graphite:#3F4550;--gris:#68717E;
  --trait:#C9D1DC;--bleu:#22368C;--bleu-pale:#E6EAF6;--rouge:#A3282B;--rouge-pale:#F7E9E9;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--fond);color:var(--encre);
  font-family:"Newsreader",Georgia,"Times New Roman",serif;font-size:16.5px;line-height:1.6}
.page{max-width:1000px;margin:0 auto;padding:0 20px 96px}

.barre{background:var(--encre);color:#fff;margin:0 -20px;padding:14px 20px;
  display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px}
.barre .tag{font-family:"DM Mono",ui-monospace,monospace;font-size:10.5px;letter-spacing:.14em;
  text-transform:uppercase;border:1px solid rgba(255,255,255,.4);padding:3px 8px;flex:0 0 auto}
.barre .curseur{flex:1 1 260px;display:flex;align-items:center;gap:12px;min-width:200px}
.barre input[type=range]{flex:1;accent-color:#fff;min-width:120px}
.barre .jour{font-family:"DM Mono",ui-monospace,monospace;font-size:13px;white-space:nowrap}
.barre button{font-family:"Newsreader",Georgia,serif;font-size:13px;background:#1B2330;color:#fff;
  border:1px solid #39414F;padding:7px 14px;cursor:pointer}
.barre button:hover{background:#28313F}
.barre button:focus-visible,.barre input:focus-visible{outline:2px solid #fff;outline-offset:2px}

.statut{padding:52px 0 34px;border-bottom:1px solid var(--trait);text-align:center}
.titre-page{font-family:"Newsreader",Georgia,serif;font-weight:600;
  font-size:clamp(30px,4.6vw,46px);line-height:1.06;letter-spacing:-.015em;margin:0 0 14px}
.fil{font-family:"DM Mono",ui-monospace,monospace;font-size:11px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--gris);margin:0 0 30px}
.phrase{font-family:"Newsreader",Georgia,serif;
  font-weight:400;font-size:clamp(24px,3.6vw,36px);line-height:1.16;letter-spacing:-.008em;
  margin:0 auto;max-width:22ch;color:var(--graphite)}
.phrase .l{display:block}
.phrase .l.an{color:var(--bleu)}
.phrase .l.senat{color:var(--rouge)}

.couloirs{display:flex;justify-content:space-between;align-items:center;margin:46px 0 8px}
.couloir{font-family:"Newsreader",Georgia,serif;font-weight:600;
  font-size:12px;letter-spacing:.18em;text-transform:uppercase}
.couloir.gauche{color:var(--bleu)}
.couloir.droite{color:var(--rouge)}
.couloir.milieu{color:var(--gris);font-size:10px;letter-spacing:.1em}

.navette{list-style:none;margin:0;padding:0;position:relative}
.navette::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;
  background:var(--trait);transform:translateX(-.5px)}
.jalon{position:relative;display:grid;grid-template-columns:1fr 60px 1fr;margin-bottom:12px}
.carte{grid-column:1;padding-right:34px;text-align:right}
.jalon[data-cote="droite"] .carte{grid-column:3;padding:0 0 0 34px;text-align:left}
.jalon[data-cote="centre"] .carte{grid-column:1/-1;padding:0;text-align:center;max-width:470px;margin:0 auto}
.jalon[data-etat="venir"]{opacity:.42}

.puce{grid-column:2;justify-self:center;align-self:start;margin-top:15px;width:12px;height:12px;
  border-radius:50%;background:var(--fond);border:2px solid var(--trait);position:relative;z-index:2}
.jalon[data-etat="fait"] .puce{background:var(--graphite);border-color:var(--graphite)}
.jalon[data-chambre="an"][data-etat="fait"] .puce{background:var(--bleu);border-color:var(--bleu)}
.jalon[data-chambre="senat"][data-etat="fait"] .puce{background:var(--rouge);border-color:var(--rouge)}
.jalon[data-etat="cours"] .puce{background:#fff;border-width:4px;border-color:var(--graphite);
  width:18px;height:18px;margin-top:12px}
.jalon[data-chambre="an"][data-etat="cours"] .puce{border-color:var(--bleu)}
.jalon[data-chambre="senat"][data-etat="cours"] .puce{border-color:var(--rouge)}
.jalon[data-etat="cours"] .puce::after{content:"";position:absolute;inset:-9px;border-radius:50%;
  border:1px solid currentColor;opacity:.5;animation:halo 2.4s ease-out infinite}
.jalon[data-chambre="an"][data-etat="cours"] .puce::after{color:var(--bleu)}
.jalon[data-chambre="senat"][data-etat="cours"] .puce::after{color:var(--rouge)}
@keyframes halo{0%{transform:scale(.7);opacity:.6}100%{transform:scale(1.5);opacity:0}}

.tete{background:var(--surface);border:1px solid var(--trait);width:100%;text-align:inherit;
  padding:13px 15px;cursor:pointer;font-family:inherit;color:inherit;transition:border-color .15s}
.tete:hover{border-color:var(--graphite)}
.tete:focus-visible{outline:2px solid var(--encre);outline-offset:2px}
.jalon[data-etat="cours"] .tete{box-shadow:0 2px 0 0 var(--graphite);border-color:var(--graphite)}
.jalon[data-chambre="an"][data-etat="cours"] .tete{box-shadow:0 2px 0 0 var(--bleu);border-color:var(--bleu)}
.jalon[data-chambre="senat"][data-etat="cours"] .tete{box-shadow:0 2px 0 0 var(--rouge);border-color:var(--rouge)}
.jalon[data-etat="venir"] .tete{background:transparent;border-style:dashed}

.quand{font-family:"DM Mono",ui-monospace,monospace;font-size:11px;letter-spacing:.06em;
  color:var(--gris);display:block;margin-bottom:5px}
.jalon[data-chambre="an"] .quand{color:var(--bleu)}
.jalon[data-chambre="senat"] .quand{color:var(--rouge)}
.nom{font-family:"Newsreader",Georgia,serif;font-weight:600;
  font-size:18.5px;line-height:1.28;margin:0}
.doc{font-family:"DM Mono",ui-monospace,monospace;font-size:12px;color:var(--graphite);margin:6px 0 0}

.fiche{margin-top:9px;background:var(--surface);border:1px solid var(--trait);
  border-left:3px solid var(--graphite);padding:15px 17px;text-align:left;font-size:14.5px}
.jalon[data-chambre="an"] .fiche{border-left-color:var(--bleu)}
.jalon[data-chambre="senat"] .fiche{border-left-color:var(--rouge)}
.fiche p{margin:0 0 11px}
.fiche p:last-child{margin-bottom:0}
.cle{font-family:"DM Mono",ui-monospace,monospace;font-size:10px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--gris);display:block;margin-bottom:2px}
.fiche a{color:var(--bleu);text-underline-offset:2px;word-break:break-word}
.pied{margin-top:48px;padding-top:16px;border-top:1px solid var(--trait);
  font-family:"DM Mono",ui-monospace,monospace;font-size:11.5px;line-height:1.9;color:var(--gris)}
.pied a{color:var(--gris);text-underline-offset:2px}
.pied a:hover{color:var(--bleu)}
.pied .sep{opacity:.45;padding:0 6px}
.absent{color:var(--gris);font-style:italic}


@media (max-width:720px){
  .couloirs{display:none}
  .navette::before{left:6px}
  .jalon{grid-template-columns:26px 1fr}
  .carte,.jalon[data-cote="droite"] .carte,.jalon[data-cote="centre"] .carte{
    grid-column:2;padding:0;text-align:left;max-width:none;margin:0}
  .puce{grid-column:1;grid-row:1;justify-self:start}
  .jalon[data-etat="cours"] .puce{margin-left:-3px}
  .phrase{max-width:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="page">

<div class="barre">
  <span class="tag">Rejeu des données réelles</span>
  <div class="curseur">
    <label for="curseur" class="jour" id="etiquette">14 octobre 2025</label>
    <input type="range" id="curseur" min="0" max="129" value="64" aria-label="Se placer à une date">
  </div>
  <button type="button" id="rejouer">Rejouer la procédure</button>
</div>

<section class="statut">
  <h1 class="titre-page">Suivi du Projet de loi de finance pour 2026</h1>
  <p class="fil">Phase parlementaire · rejeu des données officielles</p>
  <p class="phrase" id="phrase"></p>
</section>

<div class="couloirs">
  <span class="couloir gauche">Assemblée nationale</span>
  <span class="couloir milieu"></span>
  <span class="couloir droite">Sénat</span>
</div>

<ol class="navette" id="navette"></ol>

<footer class="pied" id="pied"></footer>

</div>

<script>
(function(){
  "use strict";

  var DEPOT = new Date(2025,9,14);
  var MAX = 129;

  var E = [];


  function dt(s){var p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2]);}
  function ajout(d,n){var x=new Date(d.getTime());x.setDate(x.getDate()+n);return x;}
  function fr(d){return d.toLocaleDateString("fr-FR",{day:"numeric",month:"long",year:"numeric"});}
  function ecart(a,b){return Math.round((b-a)/86400000);}

  var elC=document.getElementById("curseur"),elE=document.getElementById("etiquette"),
      elP=document.getElementById("phrase"),elN=document.getElementById("navette"),
      elRj=document.getElementById("rejouer");

  var ouverts={},anim=null;

  function rendu(){
    var j=parseInt(elC.value,10), auj=ajout(DEPOT,j);
    elE.textContent=fr(auj);

    var dernier=-1;
    E.forEach(function(e,i){ if(dt(e.d)<=auj) dernier=i; });

    if(dernier<0){
      elP.innerHTML='<span class="l">Le PLF 2026</span><span class="l">n\'est pas encore déposé.</span>';
    }else{
      var e=E[dernier], cls=e.ch==="an"?"an":"senat";
      elP.innerHTML='<span class="l">Le texte</span><span class="l '+cls+'">'+e.ph+".</span>";
    }

    elN.innerHTML=E.map(function(e,i){
      var etat = i<dernier?"fait":(i===dernier?"cours":"venir");
      var o=!!ouverts[i];
      return '<li class="jalon" data-cote="'+e.co+'" data-chambre="'+e.ch+'" data-etat="'+etat+'">'+
        '<span class="puce" aria-hidden="true"></span>'+
        '<div class="carte">'+
          '<button class="tete" type="button" aria-expanded="'+o+'" data-i="'+i+'">'+
            '<span class="quand">'+fr(dt(e.d))+' · jour '+ecart(DEPOT,dt(e.d))+'</span>'+
            '<p class="nom">'+e.nom+'</p>'+
            '<p class="doc">'+e.doc+'</p>'+
          '</button>'+
          (o?'<div class="fiche">'+
            '<p>'+e.txt+'</p>'+
            (e.lien
              ? '<p><span class="cle">Document officiel</span><a href="'+e.lien+'" target="_blank" rel="noopener">'+e.lien+'</a></p>'
              : '<p><span class="cle">Document officiel</span><span class="absent">Non encore publié</span></p>')+
          '</div>':'')+
        '</div></li>';
    }).join("");

  }

  elC.addEventListener("input",rendu);
  elN.addEventListener("click",function(ev){
    var b=ev.target.closest(".tete");if(!b)return;
    var i=b.getAttribute("data-i");ouverts[i]=!ouverts[i];rendu();
  });
  elRj.addEventListener("click",function(){
    if(anim){clearInterval(anim);anim=null;elRj.textContent="Rejouer la procédure";return;}
    if(window.matchMedia("(prefers-reduced-motion: reduce)").matches){elC.value=MAX;rendu();return;}
    elC.value=0;rendu();elRj.textContent="Arrêter";
    anim=setInterval(function(){
      var v=parseInt(elC.value,10);
      if(v>=MAX){clearInterval(anim);anim=null;elRj.textContent="Rejouer la procédure";return;}
      elC.value=v+1;rendu();
    },95);
  });

  function jour(a,b){return Math.round((b-a)/86400000);}

  /* La séquence produite par le collecteur est préférée. Si elle n'existe pas
     encore, on retombe sur la séquence saisie à la main. */
  function sequence(){
    return fetch('donnees/plf-2026-auto.json?t='+Date.now())
      .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
      .catch(function(){
        return fetch('donnees/plf-2026.json?t='+Date.now()).then(function(r){ return r.json(); });
      });
  }

  Promise.all([
    fetch('donnees/catalogue-etapes.json?t='+Date.now()).then(function(r){return r.json();}),
    sequence()
  ]).then(function(res){
    var cat = res[0].etapes, d = res[1];

    var p = d.depot.split('-');
    DEPOT = new Date(+p[0], +p[1]-1, +p[2]);

    E = d.sequence.map(function(ev){
      var c = cat[ev.etape];
      if(!c) return null;
      return {
        d: ev.date,
        ch: c.chambre === 'senat' ? 'senat' : 'an',
        co: c.cote,
        nom: c.nom,
        doc: ev.doc || '',
        txt: c.texte + (ev.precision ? ' ' + ev.precision : ''),
        lien: ev.lien || '',
        ph: c.phrase
      };
    }).filter(Boolean);

    if(!E.length) throw new Error('sequence vide');

    var derniere = dt(E[E.length-1].d);
    MAX = Math.max(1, jour(DEPOT, derniere) + 3);

    /* Deux dates distinctes : quand les sources ont ete consultees,
       et quand le dernier evenement est survenu. */
    var verif = d.derniere_verification
      ? d.derniere_verification.replace(" UTC", " UTC")
      : "non renseignée";
    document.getElementById("pied").innerHTML =
      'Données vérifiées le <b>' + verif + '</b>' +
      '<span class="sep">\u00b7</span>' +
      'dernier évènement constaté le <b>' + fr(derniere) + '</b><br>' +
      'Sources : Assemblée nationale et Sénat, licence ouverte Etalab' +
      '<span class="sep">\u00b7</span>' +
      '<a href="mentions-legales.html">Mentions légales</a>';
    elC.max = MAX;
    elC.value = MAX;
    rendu();
  }).catch(function(){
    elP.innerHTML = '<span class="l">Données indisponibles.</span>';
  });
})();
</script>
</body>
</html>
